<!-- NEGATIVE control for ONE boundary: only-palette-themes-carry-trees must
     FAIL, while the other two assertions PASS.

     Offers all five correctly and never round-trips the applied value, but
     applies the selection through `root.dataset.theme = choice` with no
     resolution step — so choosing "Match my device" mints
     data-theme="system", a token tree DDR-004 says does not exist. The
     earlier regex could not match this assignment syntax at all. -->
<select id="theme-choice">
  <option value="light">Light</option>
  <option value="dark">Dark</option>
  <option value="system">Match my device</option>
  <option value="high-contrast">High contrast</option>
  <option value="colour-safe">Colour safe</option>
</select>
<script>
  const root = document.documentElement;
  document.getElementById('theme-choice').addEventListener('change', (event) => {
    const choice = event.target.value;
    localStorage.setItem('oak-theme-choice', choice);
    root.dataset.theme = choice;
  });
</script>
