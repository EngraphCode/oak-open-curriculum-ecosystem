# HISTORICAL: this was the standalone repository's CI. Inside the OCE
# projection this workflow is inert (GitHub only reads the repo-root
# .github/), and the standalone `pnpm install` path is retired — the
# evidence package is installed and gated as an OCE workspace member.
# Steps are kept trued to the current entry points for the record.
name: Research integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @oaknational/research-evidence check-research
      - run: pnpm --filter @oaknational/research-evidence test
