# HISTORICAL: the standalone repository's workspace manifest, retained for the
# record. It is NOT installable in the OCE projection — the evidence package's
# workspace:* devDependencies resolve in the OCE workspace (which registers
# packages/research-evidence as a member), not here. Operate the package
# through the OCE root: `pnpm --filter @oaknational/research-evidence <script>`.
# The sibling pnpm-lock.yaml is likewise a historical artefact of the
# standalone era and is not maintained.
packages:
  - apps/*
  - packages/*
