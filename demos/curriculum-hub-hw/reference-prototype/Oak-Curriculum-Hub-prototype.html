<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bundled Page</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #fff7cc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #__bundler_loading {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #666;
        background: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        z-index: 10000;
      }
      #__bundler_thumbnail {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff7cc;
        z-index: 9999;
      }
      #__bundler_thumbnail svg {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #__bundler_placeholder {
        color: #999;
        font-size: 14px;
      }
    </style>

    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        const loading = document.getElementById('__bundler_loading');
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          'error',
          function (e) {
            var p = document.body || document.documentElement;
            var d =
              document.getElementById('__bundler_err') ||
              p.appendChild(document.createElement('div'));
            d.id = '__bundler_err';
            d.style.cssText =
              'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
              '[bundle] ' +
              (e.message || e.type) +
              (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
          },
          true,
        );

        try {
          const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
          const templateEl = document.querySelector('script[type="__bundler/template"]');
          if (!manifestEl || !templateEl) {
            setStatus('Error: missing bundle data');
            console.error(
              '[bundler] Missing script tags — manifestEl:',
              !!manifestEl,
              'templateEl:',
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          const uuids = Object.keys(manifest);
          setStatus('Unpacking ' + uuids.length + ' assets...');

          const blobUrls = {};
          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== 'undefined') {
                    const ds = new DecompressionStream('gzip');
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      'DecompressionStream not available, asset ' + uuid + ' may not render',
                    );
                  }
                }

                blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
              } catch (err) {
                console.error('Failed to decode asset ' + uuid + ':', err);
                blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
              }
            }),
          );

          const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          setStatus('Rendering...');
          for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, '')
            .replace(/\s+crossorigin="[^"]*"/gi, '');

          const resourceScript =
            '<script>window.__resources = ' +
            JSON.stringify(resourceMap)
              .split('</' + 'script>')
              .join('<\\/' + 'script>') +
            ';</' +
            'script>';
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template = template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, 'text/html');
          document.documentElement.replaceWith(doc.documentElement);
          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement('script');
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: fetch and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
              const r = await fetch(s.src);
              s.textContent = await r.text();
              s.removeAttribute('src');
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus('Error unpacking: ' + err.message);
          console.error('Bundle unpack error:', err);
        }
      });
    </script>

555;\n  --oak-lemon30: #fff7cc;\n  --oak-lemon50: #fff2aa;\n  --oak-lemon110: #fbd60e;\n\n  /* --- Functional --- */\n  --oak-amber: #ff934e;\n  --oak-amber30: #ffece0;\n  --oak-amber50: #ffc8a6;\n  --oak-red: #dd0035;\n  --oak-red30: #f8d8e0;\n  --oak-red50: #ee809a;\n  --oak-navy: #0d24c4;\n  --oak-navy110: #0a1d9d;\n  --oak-navy120: #081676;\n\n  /* --- Teaching resources only (slides etc) --- */\n  --oak-blue: #374cf1;\n  --oak-magenta: #d02aa7;\n  --oak-purple: #845ad9;\n  --oak-teal: #037b7d;\n\n  /* --- Semantic role tokens (default theme) --- */\n  --text-primary: var(--oak-black);\n  --text-subdued: var(--oak-grey60);\n  --text-error: var(--oak-red);\n  --text-disabled: var(--oak-grey50);\n  --text-link: var(--oak-navy);\n  --text-link-hover: var(--oak-navy110);\n  --text-link-visited: var(--oak-navy120);\n  --text-inverted: var(--oak-white);\n  --text-success: var(--oak-green);\n\n  --bg-primary: var(--oak-white);\n  --bg-inverted: var(--oak-black);\n  --bg-neutral: var(--oak-grey20);\n  --bg-neutral-stronger: var(--oak-grey30);\n  --bg-btn-primary: var(--oak-black);\n  --bg-btn-primary-hover: var(--oak-grey60);\n  --bg-btn-secondary: var(--oak-white);\n  --bg-btn-secondary-hover: var(--oak-grey20);\n\n  --bg-correct: var(--oak-mint50);\n  --bg-incorrect: var(--oak-red30);\n  --bg-success: var(--oak-green);\n  --bg-error: var(--oak-red);\n\n  --border-primary: var(--oak-black);\n  --border-neutral: var(--oak-grey50);\n  --border-neutral-lighter: var(--oak-grey40);\n  --border-brand: var(--oak-green);\n  --border-error: var(--oak-red);\n  --border-warning: var(--oak-amber);\n\n  /* --- Border widths --- */\n  --border-solid-none: 0; /* @kind spacing */\n  --border-solid-s: 1px;\n  --border-solid-m: 2px;\n  --border-solid-l: 3px;\n  --border-solid-xl: 4px;\n  --border-solid-xxl: 6px;\n  --border-solid-xxxl: 8px;\n  --border-solid-xxxxl: 10px;\n\n  /* --- Border radii --- */\n  --radius-square: 0;\n  --radius-xs: 2px;\n  --radius-s: 4px;\n  --radius-m: 6px;\n  --radius-m2: 8px;\n  --radius-l: 16px;\n  --radius-xl: 24px;\n  --radius-circle: 100px;\n\n  /* --- Spacing (primitives, px) - Oak's full 0→1360 scale --- */\n  --space-0: 0;\n  --space-2: 2px;\n  --space-4: 4px;\n  --space-8: 8px;\n  --space-12: 12px;\n  --space-16: 16px;\n  --space-20: 20px;\n  --space-24: 24px;\n  --space-32: 32px;\n  --space-40: 40px;\n  --space-48: 48px;\n  --space-56: 56px;\n  --space-64: 64px;\n  --space-72: 72px;\n  --space-80: 80px;\n  --space-92: 92px;\n  --space-100: 100px;\n  --space-120: 120px;\n  --space-160: 160px;\n  --space-180: 180px;\n  --space-240: 240px;\n  --space-360: 360px;\n  --space-480: 480px;\n  --space-640: 640px;\n  --space-960: 960px;\n  --space-1280: 1280px;\n  --space-1360: 1360px;\n\n  /* --- Drop shadows (Oak's signature \"offset solid\" shadows) --- */\n  --shadow-standard: 0 0.5rem 0.5rem rgba(92, 92, 92, 0.2);\n  --shadow-lemon: 0.125rem 0.125rem 0 #ffe555;\n  --shadow-wide-lemon: 0.25rem 0.25rem 0 #ffe555;\n  --shadow-centered-lemon: 0 0 0 0.125rem #ffe555;\n  --shadow-grey: 0.25rem 0.25rem 0 #575757;\n  --shadow-centered-grey: 0 0 0 0.3rem #575757;\n  --shadow-black: 0.063rem 0.125rem 0 #000;\n\n  /* --- Type family --- */\n  --font-sans: \"Lexend\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-mono: \"Roboto Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* --- Font sizes (px) --- */\n  --font-size-1: 12px;\n  --font-size-2: 14px;\n  --font-size-3: 16px;\n  --font-size-4: 18px;\n  --font-size-5: 20px;\n  --font-size-6: 24px;\n  --font-size-7: 32px;\n  --font-size-8: 40px;\n  --font-size-9: 48px;\n  --font-size-10: 56px;\n}\n\n/* --- Base --- */\nhtml, body {\n  font-family: var(--font-sans);\n  color: var(--text-primary);\n  background: var(--bg-primary);\n  font-weight: 300;\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ============================================================\n   Semantic type classes (match oakFontTokens).\n   Use as className or via @extend in your C  { font: 700 18px/24px var(--font-mono); letter-spacing: 0.0115rem; }\n\n/* ============================================================\n   Native element defaults - apply \"oak-scope\" to a root to opt in\n   without globally restyling every host page.\n   ============================================================ */\n.oak-scope h1 { font: 600 48px/56px var(--font-sans); letter-spacing: 0.0115rem; margin: 0 0 24px; }\n.oak-scope h2 { font: 600 40px/48px var(--font-sans); letter-spacing: 0.0115rem; margin: 0 0 20px; }\n.oak-scope h3 { font: 600 32px/40px var(--font-sans); letter-spacing: 0.0115rem; margin: 0 0 16px; }\n.oak-scope h4 { font: 600 24px/32px var(--font-sans); letter-spacing: 0.0115rem; margin: 0 0 12px; }\n.oak-scope h5 { font: 600 20px/24px var(--font-sans); letter-spacing: 0.0115rem; margin: 0 0 8px; }\n.oak-scope p  { font: 300 18px/28px var(--font-sans); letter-spacing: -0.005rem; margin: 0 0 16px; color: var(--text-primary); }\n.oak-scope a  { color: var(--text-link); text-decoration: underline; text-underline-offset: 2px; }\n.oak-scope a:hover { color: var(--text-link-hover); }\n\n/* Oak's signature: thick black borders + offset yellow shadow for interactive things */\n.oak-interactive {\n  border: var(--border-solid-m) solid var(--oak-black);\n  border-radius: var(--radius-m);\n  box-shadow: var(--shadow-lemon);\n  transition: transform 120ms ease, box-shadow 120ms ease;\n}\n.oak-interactive:hover { box-shadow: var(--shadow-wide-lemon); }\n.oak-interactive:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #ffe555; }\n\n<\u002Fstyle>\n  <script src=\"1a4c4fa6-c298-4caf-9c5a-f9eccab0b8f1\"><\u002Fscript>\n  <style>\n    *{box-sizing:border-box}\n    html,body{margin:0;padding:0;background:#f4f3ef}\n    :focus-visible{outline:3px solid #0d24c4;outline-offset:2px;border-radius:3px}\n    ::selection{background:#ffe555}\n    @keyframes oakIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n    @keyframes oakFloat{0%, nowrap\">Wiki<\u002Fa>\n      <\u002Fnav>\n      <div style=\"margin-left:auto;display:flex;align-items:center;gap:14px\">\n        <div style=\"display:flex;align-items:center;gap:8px;border:2px solid #222;border-radius:100px;background:#fff;padding:7px 14px;width:230px\">\n          <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#575757\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n          <input value=\"{{ query }}\" oninput=\"{{ onSearch }}\" placeholder=\"Search the hub\" aria-label=\"Search the hub\" style=\"border:none;outline:none;font:300 15px/1 'Lexend';color:#222;background:transparent;width:100%\">\n        <\u002Fdiv>\n        <div style=\"width:40px;height:40px;border-radius:100px;border:2px solid #222;background:#bef2bd;display:flex;align-items:center;justify-content:center;font:700 14px/1 'Lexend';flex:0 0 auto\" title=\"Your account\">CT<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ===================== HERO ===================== -->\n  <section style=\"background:#fff7cc;border-bottom:3px solid #222;position:relative;overflow:hidden\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:56px 28px 60px;position:relative\">\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:#222;color:#fff;border-radius:100px;padding:7px 15px;font:700 12px/1 'Lexend';letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px\">Single source of truth<\u002Fdiv>\n      <h1 style=\"font:600 52px/58px 'Lexend';letter-spacing:.0115rem;margin:0 0 18px;max-width:18ch;text-wrap:balance\">Oak Curriculum and Lesson Creation<\u002Fh1>\n      <p style=\"font:300 21px/31px 'Lexend';letter-spacing:-.005rem;margin:0 0 30px;max-width:60ch;color:#222\">Everything you need to create high-quality lessons at Oak, connected in one place. Training, quality standards, rubrics, exemplars and our shared wiki — so the way we work is always clear, current and joined up.<\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:10px;border:3px solid #222;border-radius:100px;background:#fff;padding:9px 12px 9px 20px;max-width:620px;box-shadow:4px 4px 0 #ffe555\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#575757\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n        <input value=\"{{ query }}\" oninput=\"{{ onSearch }}\" placeholder=\"Search courses, standards, rubrics, exemplars…\" aria-label=\"Search everything\" style=\"border:none;outline:none;font:300 18px/1 'Lexend';color:#222;background:transparent;width:100%\">\n        <button onclick=\"{{ noop }}\" style=\"flex:0 0 auto;border:2px solid #222;border-radius:100px;background:#222;color:#fff;font:700 15px/1 'Lexend';padding:11px 20px;cursor:pointer\">Search<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== DESTINATIONS ===================== -->\n  <main style=\"max-width:1240px;margin:0 auto;padding:48px 28px 24px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap\">\n      <h2 style=\"font:600 30px/36px 'Lexend';letter-spacing:.0115rem;margin:0\">{{ sectionHeading }}<\u002Fh2>\n      <sc-if value=\"{{ isSearching }}\" hint-placeholder-val=\"{{ false }}\">\n        <button onclick=\"{{ clearSearch }}\" style=\"border:2px solid #222;border-radius:100px;background:#fff;font:600 14px/1 'Lexend';padding:9px 16px;cursor:pointer;box-shadow:2px 2px 0 #ffe555\">Clear search<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasDest }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px\">\n      <sc-for list=\"{{ destinations }}\" as=\"d\" hint-placeholder-count=\"5\">\n        <a class=\"oak-card\" href=\"{{ d.href }}\" target=\"{{ d.target }}\" style=\"{{ d.cardStyle }}\">\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px\">\n            <div style=\"{{ d.iconWrapStyle }}\">{{ d.iconEl }}<\u002Fdiv>\n            <sc-if value=\"{{ d.hasCount }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"margin-left:auto;background:#fff;border:2px solid #222;border-radius:100px;font:700 13px/1 'Lexend';padding:6px 12px\">{{ d.count }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <h3 style=\"font:600 23px/28px 'Lexend';letter-spacing:.0115rem;margin:0 0 8px\">{{ d.title }}<\u002Fh3>\n          <p style=\"font:300 16px/24px 'Lexend';margin:0 0 18px;color:#222;flex:1\">{{ d.desc }}<\u002Fp>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font:700 15px/1 'Lexend';color:#222\">{{ d.cta }} <span style=\"font-size:18px\">→<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== OAK CURRICULUM (live connector data) ===== -->\n    <sc-if value=\"{{ hasCurriculum }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:40px\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap\">\n          <span style=\"width:34px;height:34px;border-radius:9px;border:2px solid #222;background:#bdeee9;display:flex;align-items:center;justify-content:center;flex:0 0 auto\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#222\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3L2 8l10 5 10-5-10-5z\"><\u002Fpath><path d=\"M2 13l10 5 10-5\"><\u002Fpath><path d=\"M2 18l10 5 10-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <h3 style=\"font:600 20px/26px 'Lexend';letter-spacing:.0115rem;margin:0\">From the Oak curriculum<\u002Fh3>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;background:#bef2bd;border:2px solid #222;border-radius:100px;font:700 11px/1 'Lexend';letter-spacing:.04em;text-transform:uppercase;padding:5px 10px\"><span style=\"width:7px;height:7px;border-radius:100px;background:#287c34\"><\u002Fspan>Live<\u002Fspan>\n          <span style=\"font:300 14px/20px 'Lexend';color:#575757\">Lessons, units and threads from thenational.academy<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasLesson }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px\">\n            <div style=\"font:700 12px/1 'Lexend';letter-spacing:.05em;text-transform:uppercase;color:#575757;margin-bottom:10px\">Lessons<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px\">\n              <sc-for list=\"{{ lessonHits }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <a href=\"{{ l.href }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;flex-direction:column;gap:9px;text-decoration:none;color:#222;border:2px solid #222;border-radius:12px;background:#fff;box-shadow:2px 2px 0 #ffe555;padding:15px 17px\">\n                  <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap\">\n                    <span style=\"{{ l.subjectChipStyle }}\">{{ l.subjectName }}<\u002Fspan>\n                    <span style=\"font:700 11px/1 'Lexend';color:#575757;border:1px solid #e0ded6;border-radius:100px;padding:5px 9px\">{{ l.stage }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font:600 16px/22px 'Lexend'\">{{ l.title }}<\u002Fspan>\n                  <span style=\"font:300 13px/18px 'Lexend';color:#575757\">{{ l.unitLine }}<\u002Fspan>\n                  <span style=\"font:700 13px/1 'Lexend';color:#143b78;margin-top:2px\">Open lesson on Oak ↗<\u002Fspan>\n                <\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasUnit }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:18px\">\n            <div style=\"font:700 12px/1 'Lexend';letter-spacing:.05em;text-transform:uppercase;color:#575757;margin-bottom:10px\">Units<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ unitHits }}\" as=\"u\" hint-placeholder-count=\"2\">\n                <a href=\"{{ u.href }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:14px;text-decoration:none;color:#222;border:2px solid #222;border-radius:12px;background:#fff;box-shadow:2px 2px 0 #ffe555;padding:14px 18px\">\n                  <span style=\"{{ u.subjectChipStyle }}\">{{ u.subjectName }}<\u002Fspan>\n                  <span style=\"flex:1;font:600 16px/22px 'Lexend'\">{{ u.title }}<\u002Fspan>\n                  <span style=\"flex:0 0 auto;font:700 12px/1 'Lexend';color:#575757;border:1px solid #e0ded6;border-radius:100px;padding:6px 10px\">{{ u.meta }}<\u002Fspan>\n                  <span style=\"flex:0 0 auto;font:700 13px/1 'Lexend';color:#143b78\">↗<\u002Fspan>\n                <\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasThread }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:18px\">\n            <div style=\"font:700 12px/1 'Lexend';letter-spacing:.05em;text-transform:uppercase;color:#575757;margin-bottom:10px\">Learning threads<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n              <sc-for list=\"{{ threadHits }}\" as=\"th\" hint-placeholder-count=\"2\">\n                <a href=\"{{ th.href }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#222;border:2px solid #222;border-radius:100px;background:#f5e9f2;box-shadow:2px 2px 0 #222;padding:9px 16px\">\n                  <span style=\"font:600 15px/1 'Lexend'\">{{ th.title }}<\u002Fspan>\n                  <span style=\"font:700 12px/1 'Lexend';color:#575757\">{{ th.meta }}<\u002Fspan>\n                <\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- TRAINING (eLearning) RESULTS -->\n    <sc-if value=\"{{ hasCourse }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:36px\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n          <span style=\"width:34px;height:34px;border-radius:9px;border:2px solid #222;background:#bef2bd;display:flex;align-items:center;justify-content:center;flex:0 0 auto\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#222\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 10L12 5 2 10l10 5 10-5z\"><\u002Fpath><path d=\"M6 12v5c0 1 3 3 6 3s6-2 6-3v-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <h3 style=\"font:600 20px/26px 'Lexend';letter-spacing:.0115rem;margin:0\">In the training courses<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ courseHits }}\" as=\"c\" hint-placeholder-count=\"2\">\n            <a href=\"{{ c.href }}\" style=\"display:flex;align-items:center;gap:14px;text-decoration:none;color:#222;border:2px solid #222;border-radius:12px;background:#fff;box-shadow:2px 2px 0 #ffe555;padding:15px 18px\">\n              <span style=\"flex:0 0 auto;font:700 11px/1 'Lexend';letter-spacing:.04em;text-transform:uppercase;color:#575757;background:#ebfbeb;border:2px solid #222;border-radius:100px;padding:6px 11px\">{{ c.module }}<\u002Fspan>\n              <span style=\"flex:1;font:600 17px/23px 'Lexend'\">{{ c.title }}<\u002Fspan>\n              <span style=\"flex:0 0 auto;font:700 14px/1 'Lexend';color:#575757\">Open →<\u002Fspan>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- QUALITY STANDARDS RESULTS -->\n    <sc-if value=\"{{ hasStd }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:36px\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n          <span style=\"width:34px;height:34px;border-radius:9px;border:2px solid #222;background:#a0b6f2;display:flex;align-items:center;justify-content:center;flex:0 0 auto\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#222\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"><\u002Fpath><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <h3 style=\"font:600 20px/26px 'Lexend';letter-spacing:.0115rem;margin:0\">Quality standards<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ stdHits }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <a href=\"{{ s.href }}\" style=\"display:flex;align-items:flex-start;gap:14px;text-decoration:none;color:#222;border:2px solid #222;border-radius:12px;background:#fff;box-shadow:2px 2px 0 #ffe555;padding:15px 18px\">\n              <span style=\"flex:0 0 auto;font:700 12px/1 'Lexend';color:#143b78;background:#e7f0fd;border:2px solid #2a6fdb;border-radius:6px;padding:6px 9px\">{{ s.id }}<\u002Fspan>\n              <span style=\"flex:1;font:300 16px/23px 'Lexend'\">{{ s.text }}<\u002Fspan>\n              <sc-if value=\"{{ s.hasArea }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"flex:0 0 auto;font:700 11px/1 'Lexend';color:#575757;border:1px solid #e0ded6;border-radius:100px;padding:6px 10px\">{{ s.area }}<\u002Fspan><\u002Fsc-if>\n            <\u002Fa>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ hasStdMore }}\" hint-placeholder-val=\"{{ false }}\">\n            <a href=\"{{ stdMoreHref }}\" style=\"text-decoration:none;color:#143b78;font:700 15px/1 'Lexend';padding:6px 2px\">See {{ stdMore }} more in quality standards →<\u002Fa>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:2px dashed #cacaca;border-radius:16px;background:#fff;padding:44px;text-align:center;margin-top:8px\">\n        <div style=\"font:600 20px/26px 'Lexend';margin-bottom:6px\">Nothing matches \"{{ query }}\"<\u002Fdiv>\n        <p style=\"font:300 16px/24px 'Lexend';color:#575757;margin:0\">Try a different word, or browse all sections.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <!-- ===================== HOW IT CONNECTS ===================== -->\n  <sc-if value=\"{{ showConnect }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"max-width:1240px;margin:0 auto;padding:28px 28px 56px\">\n    <div style=\"border:3px solid #222;border-radius:20px;background:#e3e9fb;box-shadow:4px 4px 0 #222;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:1.1fr 1fr;gap:0\">\n        <div style=\"padding:40px 40px 40px\">\n          <div style=\"font:700 12px/1 'Lexend';letter-spacing:.06em;text-transform:uppercase;color:#575757;margin-bottom:14px\">Everything's connected<\u002Fdiv>\n          <h2 style=\"font:600 32px/38px 'Lexend';letter-spacing:.0115rem;margin:0 0 14px;text-wrap:balance\">Content that links to itself<\u002Fh2>\n          <p style=\"font:300 18px/27px 'Lexend';margin:0 0 16px\">As you move through a training course, related guidance surfaces right where you need it. When a lesson touches a quality standard, you'll see a link straight to that standard and its exemplification — no hunting required.<\u002Fp>\n          <p style=\"font:300 18px/27px 'Lexend';margin:0\">Update a standard once, and every page that references it stays in step. One source of truth, joined up.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border-left:3px solid #222;padding:36px 34px;display:flex;flex-direction:column;gap:16px;justify-content:center\">\n          <div style=\"font:300 16px/24px 'Lexend';color:#575757\">In a training page, you'll see:<\u002Fdiv>\n          <!-- the linked-standard box demo -->\n          <a href=\"#\" style=\"display:block;text-decoration:none;border:2px solid #2a6fdb;border-radius:12px;background:#e7f0fd;padding:16px 18px;box-shadow:3px 3px 0 #bcd5f7\">\n            <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:7px\">\n              <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2a6fdb\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1\"><\u002Fpath><path d=\"M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font:700 12px/1 'Lexend';letter-spacing:.05em;text-transform:uppercase;color:#2a6fdb\">Linked quality standard<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font:600 17px/23px 'Lexend';color:#143b78;margin-bottom:3px\">Writing questions for checks for understanding<\u002Fdiv>\n            <div style=\"font:300 14px/20px 'Lexend';color:#2a6fdb\">View the standard and exemplification →<\u002Fdiv>\n          <\u002Fa>\n          <div style=\"font:300 13px/19px 'Lexend';color:#575757\">Pastel-blue boxes always signal a link out to a connected standard or exemplar.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ===================== FOOTER ===================== -->\n  <footer style=\"background:#222;color:#fff;border-top:3px solid #222\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:34px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <img src=\"54b85bd1-7faf-40a6-ada3-4a536a4b3130\" alt=\"\" style=\"height:30px;width:auto;filter:brightness(0) invert(1)\">\n        <span style=\"font:300 15px/21px 'Lexend';color:#cacaca;max-width:46ch\">Oak Curriculum and Lesson Creation — the internal hub for creating high-quality lessons at Oak.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:300 14px/20px 'Lexend';color:#9a9a9a\">Internal use · Oak National Academy<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { query: \"\", standards: null, curriculum: null };\n\n  componentDidMount() {\n    this._installBundleNav();\n    fetch((window.__resources && window.__resources.qsData) || \"data/quality-standards.json\")\n      .then(r => r.json())\n      .then(standards => this.setState({ standards }))\n      .catch(() => this.setState({ standards: [] }));\n    fetch((window.__resources && window.__resources.curriculum) || \"data/curriculum.json\")\n      .then(r => r.json())\n      .then(curriculum => this.setState({ curriculum }))\n      .catch(() => this.setState({ curriculum: { lessons: [], units: [], threads: [] } }));\n  }\n\n  // In the bundled single-file build, rewrite cross-page links (incl. dynamic\n  // and deep-linked ones) to the bundler's internal hash route. No-op live.\n  _installBundleNav() {\n    if (typeof window === \"undefined\" || !window.__bundler_pages) return;\n    if (window.__oakBundleNav) return;\n    window.__oakBundleNav = true;\n    document.addEventListener(\"click\", function (e) {\n      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;\n      var a = e.target.closest && e.target.closest(\"a[href]\");\n      if (!a) return;\n      var href = a.getAttribute(\"href\") || \"\";\n      var m = href.match(/^([^#]+\\.dc)\\.html(?:#.*)?$/);\n      if (m && window.__bundler_pages.indexOf(m[1]) >= 0) {\n        e.preventDefault();\n        e.stopPropagation();\n        try { parent.location.hash = \"#/\" + m[1]; } catch (err) { location.hash = \"#/\" + m[1]; }\n      }\n    }, true);\n  }\n\n  // searchable index of training-course sections (eLearning)\n  courseIndex() {\n    return [\n      { sid: \"u1m1s1\", module: \"Oak lessons\", title: \"Why Oak lessons matter\", kw: \"purpose reach classrooms\" },\n      { sid: \"u1m1s2\", module: \"Oak lessons\", title: \"The eight lesson components\", kw: \"slide deck worksheet quiz video components\" },\n      { sid: \"u1m1s4\", module: \"Oak lessons\", title: \"Lesson structure & vocabulary\", kw: \"learning cycle outcome outline key learning points\" },\n      { sid: \"u1m2s1\", module: \"Curriculum information\", title: \"What is curriculum information?\", kw: \"fit it cat curriculum authoring tool\" },\n      { sid: \"u1m2s3\", module: \"Curriculum information\", title: \"Review, create or iterate\", kw: \"misconceptions outcome cat\" },\n      { sid: \"u1m3s1\", module: \"Core considerations\", title: \"Five areas to consider\", kw: \"safety safeguarding accessibility\" },\n      { sid: \"u1m3s2\", module: \"Core considerations\", title: \"Accessibility & scaffolding\", kw: \"send wcag contrast scaffold accessible accessibility\" },\n      { sid: \"u1m3s3\", module: \"Core considerations\", title: \"Diversity\", kw: \"diversity diverse inclusive language gender stereotypes representation protected characteristics inclusion\" },\n      { sid: \"u1m3s4\", module: \"Core considerations\", title: \"Safety, safeguarding & content guidance\", kw: \"safeguarding safety content guidance external links age appropriate\" },\n      { sid: \"m1s2\", module: \"The learning framework\", title: \"What is the learning framework?\", kw: \"learning framework mccrea evidence\" },\n      { sid: \"m1s3\", module: \"The learning framework\", title: \"The seven stages\", kw: \"fit own frame get use keep check stages\" },\n      { sid: \"m2s1\", module: \"High-quality explanation\", title: \"What is explanation?\", kw: \"explanation explaining teaching strategy\" },\n      { sid: \"m2s2\", module: \"High-quality explanation\", title: \"Types of knowledge\", kw: \"declarative procedural conditional knowledge\" },\n      { sid: \"m2s3\", module: \"High-quality explanation\", title: \"Three principles\", kw: \"connected chunked clear explanation principles\" },\n      { sid: \"m2s4\", module: \"High-quality explanation\", title: \"Delivering explanations\", kw: \"simple to complex part whole cognitive load small steps\" },\n      { sid: \"m3s1\", module: \"Enriching explanation\", title: \"Six ways to enrich\", kw: \"examples non-examples images discussion modelling stories analogies\" },\n      { sid: \"m3s2\", module: \"Enriching explanation\", title: \"Worked examples in depth\", kw: \"worked examples expertise reversal\" },\n      { sid: \"m4s1\", module: \"Checks for understanding\", title: \"What is a check for understanding?\", kw: \"checks for understanding cfu cfus check responsiveness\" },\n      { sid: \"m4s2\", module: \"Checks for understanding\", title: \"Principles of good CfUs\", kw: \"checks for understanding cfu cfus mini-whiteboard guessing misconceptions\" },\n      { sid: \"m4s3\", module: \"Checks for understanding\", title: \"Question types\", kw: \"multiple choice short answer true false why checks cfu\" },\n      { sid: \"m4s4\", module: \"Checks for understanding\", title: \"Feedback\", kw: \"feedback model response praise checks cfu\" },\n    ];\n  }\n\n  renderVals() {\n    const q = (this.state.query || \"\").trim().toLowerCase();\n    const isSearching = q.length > 0;\n\n    const navLinks = [\n      { label: \"Training courses\", href: \"Oak Course.dc.html\" },\n      { label: \"Quality standards\", href: \"Oak Standards.dc.html\" },\n      { label: \"Rubrics\", href: \"#\" },\n      { label: \"Exemplars\", href: \"#\" },\n      { label: \"Wiki\", href: \"#\" },\n    ];\n\n    const icon = (paths) => React.createElement(\"svg\", {\n      width: 26, height: 26, viewBox: \"0 0 24 24\", fill: \"none\",\n      stroke: \"#222\", strokeWidth: 2, strokeLinecap: \"round\", strokeLinejoin: \"round\"\n    }, paths.map((d, i) => React.createElement(\"path\", { key: i, d })));\n    const iconShapes = (els) => React.createElement(\"svg\", {\n      width: 26, height: 26, viewBox: \"0 0 24 24\", fill: \"none\",\n      stroke: \"#222\", strokeWidth: 2, strokeLinecap: \"round\", strokeLinejoin: \"round\"\n    }, els);\n\n    const defs = [\n      {\n        key: \"courses\", title: \"eLearning training courses\", bg: \"#ebfbeb\", iconBg: \"#bef2bd\",\n        href: \"Oak Course.dc.html\", count: \"1 live\", cta: \"Start learning\",\n        desc: \"Self-paced professional courses on how we create lessons — starting with Creating lessons at Oak.\",\n        kw: \"training course elearning learning module professional development cpd creating lessons\",\n        iconEl: iconShapes([\n          React.createElement(\"path\", { key: 0, d: \"M22 10L12 5 2 10l10 5 10-5z\" }),\n          React.createElement(\"path\", { key: 1, d: \"M6 12v5c0 1 3 3 6 3s6-2 6-3v-5\" }),\n        ]),\n      },\n      {\n        key: \"curriculum\", title: \"Oak curriculum\", bg: \"#e7f6f5\", iconBg: \"#bdeee9\",\n        href: \"https://www.thenational.academy/teachers\", target: \"_blank\", count: \"Live\", cta: \"Search the curriculum\",\n        desc: \"Search live lessons, units and learning threads from Oak's published national curriculum \\u2014 straight from thenational.academy.\",\n        kw: \"curriculum lessons units threads thread programme programmes national curriculum thenational subjects key stage live oak content connector\",\n        iconEl: iconShapes([\n          React.createElement(\"path\", { key: 0, d: \"M12 3L2 8l10 5 10-5-10-5z\" }),\n          React.createElement(\"path\", { key: 1, d: \"M2 13l10 5 10-5\" }),\n          React.createElement(\"path\", { key: 2, d: \"M2 18l10 5 10-5\" }),\n        ]),\n      },\n      {\n        key: \"standards\", title: \"Quality standards\", bg: \"#e3e9fb\", iconBg: \"#a0b6f2\",\n        href: \"Oak Standards.dc.html\", count: \"685\", cta: \"Browse standards\",\n        desc: \"The benchmarks every piece of content is held to — each with clear exemplification of what good looks like.\",\n        kw: \"quality standards benchmark checks for understanding writing questions criteria\",\n        iconEl: iconShapes([\n          React.createElement(\"path\", { key: 0, d: \"M9 11l3 3L22 4\" }),\n          React.createElement(\"path\", { key: 1, d: \"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\" }),\n        ]),\n      },\n      {\n        key: \"rubrics\", title: \"Rubrics\", bg: \"#e7f6f5\", iconBg: \"#b0e2de\",\n        href: \"#\", count: \"Hub\", cta: \"Open rubrics\",\n        desc: \"Structured grids for reviewing and grading work consistently against agreed criteria.\",\n        kw: \"rubric grid grading review assessment criteria marking\",\n        iconEl: iconShapes([\n          React.createElement(\"rect\", { key: 0, x: 3, y: 3, width: 18, height: 18, rx: 2 }),\n          React.createElement(\"path\", { key: 1, d: \"M3 9h18M3 15h18M9 3v18\" }),\n        ]),\n      },\n      {\n        key: \"exemplars\", title: \"Exemplars\", bg: \"#f5e9f2\", iconBg: \"#deb7d5\",\n        href: \"#\", count: \"Hub\", cta: \"See exemplars\",\n        desc: \"Worked examples of high-quality content, annotated to show exactly why they work.\",\n        kw: \"exemplar example worked annotated model best practice\",\n        iconEl: iconShapes([\n          React.createElement(\"path\", { key: 0, d: \"M12 2l2.4 5 5.6.8-4 3.9 1 5.5L12 19.6 6 17.2l1-5.5-4-3.9L8.6 7z\" }),\n        ]),\n      },\n      {\n        key: \"wiki\", title: \"Wiki\", bg: \"#fff7cc\", iconBg: \"#ffe555\",\n        href: \"#\", count: \"Hub\", cta: \"Open the wiki\",\n        desc: \"Shared knowledge, how-tos and definitions — the living reference for how we work at Oak.\",\n        kw: \"wiki knowledge base reference glossary how to definitions documentation\",\n        iconEl: iconShapes([\n          React.createElement(\"path\", { key: 0, d: \"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\" }),\n          React.createElement(\"path\", { key: 1, d: \"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\" }),\n        ]),\n      },\n    ];\n\n    const filtered = isSearching\n      ? defs.filter(d => (d.title.toLowerCase() + \" \" + d.desc.toLowerCase() + \" \" + d.kw).includes(q))\n      : defs;\n\n    const destinations = filtered.map(d => ({\n      title: d.title, desc: d.desc, href: d.href, cta: d.cta,\n      target: d.target || \"_self\",\n      count: d.count, hasCount: true,\n      iconEl: d.iconEl,\n      cardStyle: `display:flex;flex-direction:column;text-decoration:none;color:#222;border:3px solid #222;border-radius:18px;background:${d.bg};box-shadow:4px 4px 0 #222;padding:24px 24px 26px;min-height:240px`,\n      iconWrapStyle: `width:54px;height:54px;border-radius:14px;border:2px solid #222;background:${d.iconBg};display:flex;align-items:center;justify-content:center;flex:0 0 auto`,\n    }));\n\n    // ---- global search across training sections + quality standards ----\n    const courseHits = isSearching\n      ? this.courseIndex()\n          .filter(c => (c.title + \" \" + c.module + \" \" + c.kw).toLowerCase().includes(q))\n          .map(c => ({ title: c.title, module: c.module, href: `Oak Course.dc.html#section=${c.sid}` }))\n      : [];\n\n    // ---- Oak curriculum search (real data from the curriculum connector) ----\n    const SUBJ = { maths:\"Maths\", history:\"History\", science:\"Science\", english:\"English\", geography:\"Geography\", computing:\"Computing\", \"religious-education\":\"Religious education\", \"design-technology\":\"Design and technology\", \"cooking-nutrition\":\"Cooking and nutrition\", german:\"German\" };\n    const SUBJ_BG = { maths:\"#bef2bd\", history:\"#ffd59e\", science:\"#b0e2de\", english:\"#cdbaf0\", geography:\"#bfe3a8\", computing:\"#f4b8d0\", \"religious-education\":\"#ffe555\", \"design-technology\":\"#f0c8a0\", \"cooking-nutrition\":\"#f0c8a0\", german:\"#c8d4dc\" };\n    const KSL = { ks1:\"KS1\", ks2:\"KS2\", ks3:\"KS3\", ks4:\"KS4\" };\n    const subjName = (s) => SUBJ[s] || s;\n    const chipStyle = (s) => `font:700 11px/1 'Lexend';color:#222;background:${SUBJ_BG[s] || '#eee'};border:2px solid #222;border-radius:100px;padding:5px 10px`;\n    const phaseOf = (ks) => (ks === \"ks1\" || ks === \"ks2\") ? \"primary\" : \"secondary\";\n    const cur = this.state.curriculum || { lessons: [], units: [], threads: [] };\n    const hit = (hay) => hay.toLowerCase().includes(q);\n\n    const lessonAll = isSearching\n      ? (cur.lessons || []).filter(l => hit(`${l.t} ${(l.kw||[]).join(\" \")} ${l.unit||\"\"} ${(l.threads||[]).join(\" \")} ${l.outcome||\"\"} ${subjName(l.subject)}`))\n      : [];\n    const lessonHits = lessonAll.slice(0, 9).map(l => ({\n      title: l.t,\n      subjectName: subjName(l.subject),\n      subjectChipStyle: chipStyle(l.subject),\n      stage: KSL[l.ks] + (l.years && l.years.length ? \" \\u00b7 Year \" + l.years.join(\", \") : \"\"),\n      unitLine: \"Unit: \" + (l.unit || \"\\u2014\"),\n      href: \"https://www.thenational.academy/teachers/lessons/\" + l.slug,\n    }));\n\n    const unitAll = isSearching\n      ? (cur.units || []).filter(u => hit(`${u.t} ${(u.threads||[]).join(\" \")} ${subjName(u.subject)}`))\n      : [];\n    const unitHits = unitAll.slice(0, 6).map(u => ({\n      title: u.t,\n      subjectName: subjName(u.subject),\n      subjectChipStyle: chipStyle(u.subject),\n      meta: KSL[u.ks] + \" \\u00b7 \" + u.lessons + \" lessons\",\n      href: \"https://www.thenational.academy/teachers/curriculum/\" + u.subject + \"-\" + phaseOf(u.ks) + \"/units/\" + u.slug,\n    }));\n\n    const threadAll = isSearching\n      ? (cur.threads || []).filter(t => hit(`${t.t} ${(t.subjects||[]).join(\" \")}`))\n      : [];\n    const threadHits = threadAll.slice(0, 8).map(t => ({\n      title: t.t,\n      meta: t.units ? t.units + \" units\" : \"\",\n      href: \"https://www.thenational.academy/teachers/curriculum/\" + t.subjects[0] + \"-\" + (t.phase || \"primary\") + \"/units?threads=\" + t.slug,\n    }));\n\n    const curriculumCount = lessonAll.length + unitAll.length + threadAll.length;\n\n    const stds = this.state.standards || [];\n    const stdAll = isSearching\n      ? stds.filter(s => (s.text + \" \" + s.areas.join(\" \") + \" \" + (s.code || \"\")).toLowerCase().includes(q))\n      : [];\n    const stdHits = stdAll.slice(0, 8).map(s => ({\n      id: s.id, text: s.text,\n      area: (s.areas[0] || \"\").replace(/\\s*\\(CfUs\\)/, \"\"),\n      hasArea: s.areas.length > 0,\n      href: `Oak Standards.dc.html#qs=${s.id}`,\n    }));\n    const stdMoreHref = `Oak Standards.dc.html#q=${encodeURIComponent(this.state.query.trim())}`;\n    const stdMore = stdAll.length > stdHits.length ? (stdAll.length - stdHits.length) : 0;\n\n    const totalResults = filtered.length + courseHits.length + stdAll.length + curriculumCount;\n\n    return {\n      query: this.state.query,\n      navLinks,\n      destinations, hasDest: destinations.length > 0,\n      courseHits, hasCourse: courseHits.length > 0,\n      stdHits, hasStd: stdHits.length > 0,\n      stdMore, hasStdMore: stdMore > 0, stdMoreHref,\n      stdLoading: isSearching && this.state.standards === null,\n      lessonHits, hasLesson: lessonHits.length > 0,\n      unitHits, hasUnit: unitHits.length > 0,\n      threadHits, hasThread: threadHits.length > 0,\n      hasCurriculum: curriculumCount > 0,\n      isSearching,\n      noResults: isSearching && totalResults === 0 && this.state.standards !== null && this.state.curriculum !== null,\n      showConnect: !isSearching,\n      sectionHeading: isSearching ? `Results for \"${this.state.query.trim()}\"` : \"Explore the hub\",\n      onSearch: (e) => this.setState({ query: e.target.value }),\n      clearSearch: () => this.setState({ query: \"\" }),\n      noop: (e) => { e && e.preventDefault && e.preventDefault(); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
    </script>
