other valid responses may exist.\",\n            \"Answers in the slide deck are animated, so no additional answer slides are needed. They should include full working where appropriate — for calculations, feedback might be a worked calculation.\"\n          ]},\n          {t:'compare', goodText:'True/false/why: an animated tick and \\u2018Why?\\u2019 appear together; a second click reveals a full sentence of explanation that includes the initial statement.', goodNote:'Models a good standard of written communication.', badText:'A response that is not animated and whose explanatory sentence does not include the initial statement.', badNote:'Does not model a good standard of written communication.'}\n        ]},\n        { id:'m4s5', title:'Knowledge check', blocks:[\n          {t:'quiz', title:'Quick check: question types & feedback', questions:[\n            {kind:'tf', stem:'Multiple-choice CfU answers should be labelled 1, 2, 3.', options:[{text:'True'},{text:'False', correct:true}], explain:'They should be labelled a, b, c rather than 1, 2, 3.'},\n            {kind:'mcq', stem:'When is short answer the better question type?', options:[{text:'When the answer is one of a small defined set'},{text:'When spelling of the answer matters', correct:true},{text:'When you want responses visible at a glance'}], explain:'Short answer suits cases where spelling matters or there aren\\u2019t enough plausible distractors.'},\n            {kind:'mcq', stem:'Why is \\u2018true / false / why\\u2019 a useful CfU?', options:[{text:'It removes any chance of guessing'},{text:'Explaining \\u2018why\\u2019 gives evidence of understanding beyond a 50:50 guess', correct:true},{text:'It never needs feedback'}], explain:'With a 50:50 chance of guessing, asking pupils to explain their answer provides evidence of understanding.'}\n          ]}\n        ]},\n        { id:'m4s6', title:'Module summary', blocks:[\n          {t:'text', paras:[\"The key principles of checks for understanding — and the end of the course. Nice work.\"]},\n          {t:'summary', points:[\n            \"CfU is the 'check it' stage — a constant process that's both planned and responsive, with a minimum of two CfUs peppered through each learning cycle.\",\n            \"Good CfUs are quick to answer on a mini-whiteboard, pitched so guessing is hard, and built to expose common misconceptions.\",\n            \"Choose multiple choice, short answer or true/false/why to fit the content, and always give feedback — animated in the deck so no extra slides are needed.\"\n          ], question:\"For the lesson you'll design next, what common misconception could each check for understanding be built to expose — and how would you respond when it surfaces?\"}\n        ]}\n      ]}\n    ];\n  }\n\n  // ============ RENDER ============\n  renderVals(){\n    const st=this.state;\n    const course=st.course;\n    const accMode = this.props.accentMode || 'Per module';\n    const showProgress = this.props.showProgress !== false;\n    const activeMod = this.getModule(st.activeModule);\n    const accent = accMode==='Uniform mint' ? '#bef2bd' : (activeMod.color || '#bef2bd');\n    const accentStrong = activeMod.colorStrong || '#93e892';\n\n    // ---- progress ----\n    const flat=this.flatSections();\n    const total=flat.length;\n    const done=flat.filter(f=>st.completed[f.s]).length;\n    const pct = total? Math.round(done/total*100):0;\n\n    // ---- nav ----\n    const unitNum = {};\n    course.forEach(m=>{ unitNum[m.unit]=(unitNum[m.unit]||0)+1; m._num=unitNum[m.unit]; });\n    const modules = course.map((m, mi)=>{\n      const isOpen = st.openModule===m.id;\n      const isActive = st.activeModule===m.id;\n      const mDone = m.sections.every(s=>st.completed[s.id]);\n      return {\n        title:m.title,\n        unitId:m.unit,\n        numLabel: mDone? '✓' : String(m._num),\n        isOpen,\n        onClick: ()=>this.toggleModule(m.id),\n        headerStyle:`width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;border:2px solid ${isActive?'#222':'transparent'};border-radius:10px;background:${isActive?'#fff':'transparent'};box-shadow:${isActive?'2px 2px 0 #ffe555':'none'};cursor:pointer;font:700 15px/19px 'Lexend';color:#222;text-align:left;transition:background .12s`,\n        dotStyle:`width:28px;height:28px;flex:0 0 auto;border-radius:100px;border:2px solid #222;background:${mDone?'#287c34':m.color};color:${mDone?'#fff':'#222'};display:flex;align-items:center;justify-content:center;font:700 13px/1 'Lexend'`,\n        chevStyle:`font-size:20px;color:#575757;transition:transform .15s;transform:rotate(${isOpen?'90deg':'0deg'})`,\n        sections: m.sections.map((s, si)=>{\n          const sActive = isActive && st.activeSection===s.id;\n          const sDone = !!st.completed[s.id];\n          return {\n            title:s.title,\n            onClick: ()=>this.navTo(m.id, s.id),\n            ariaCurrent: sActive? 'true' : 'false',\n            rowStyle:`width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;margin-left:14px;border:none;border-left:3px solid ${sActive?'#222':'#e4e4e4'};background:${sActive?accent:'transparent'};cursor:pointer;font:${sActive?'600':'300'} 14px/19px 'Lexend';color:#222;text-align:left;border-radius:0 8px 8px 0;transition:background .12s`,\n            iconStyle:`width:20px;height:20px;flex:0 0 auto;border-radius:100px;border:2px solid ${sDone?'#287c34':'#cacaca'};background:${sDone?'#287c34':'transparent'};color:#fff;display:flex;align-items:center;justify-content:center;font:700 11px/1 'Lexend'`,\n            iconChar: sDone? '✓' : ''\n          };\n        })\n      };\n    });\n\n    const units = this.units.map(u=>({\n      label:u.label, title:u.title,\n      modules: modules.filter(v=>v.unitId===u.id)\n    }));\n\n    // ---- intro / home nav ----\n    const introActive = st.activeModule==='intro';\n    const introNav = {\n      title:'Welcome & overview',\n      ariaCurrent: introActive ? 'true' : 'false',\n      onClick: ()=>this.navTo('intro','introMain'),\n      style:`width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;border:2px solid ${introActive?'#222':'transparent'};border-radius:10px;background:${introActive?'#fff':'transparent'};box-shadow:${introActive?'2px 2px 0 #ffe555':'none'};cursor:pointer;font:700 15px/19px 'Lexend';color:#222;text-align:left;transition:background .12s`,\n      iconStyle:`width:28px;height:28px;flex:0 0 auto;border-radius:100px;border:2px solid #222;background:#ffe555;display:flex;align-items:center;justify-content:center;font:700 14px/1 'Lexend'`\n    };\n\n    // ---- active section & blocks ----\n    const mod = activeMod;\n    const secIdx = mod.sections.findIndex(s=>s.id===st.activeSection);\n    const sec = mod.sections[secIdx] || mod.sections[0];\n    const blocks = (sec.blocks||[]).map((b, bi)=>this.enrich(b, bi, accent, accentStrong));\n\n    const ord = this.navOrder();\n    const ordIdx = ord.findIndex(x=>x.m===st.activeModule && x.s===st.activeSection);\n    const isLast = (flat.findIndex(x=>x.m===st.activeModule && x.s===st.activeSection)) === flat.length-1;\n    const secDone = !!st.completed[st.activeSection];\n\n    // ---- layout ----\n    const isM = st.isMobile;\n    const railBase = `flex-direction:column;background:#fff;border-right:3px solid #222;overflow-y:auto;`;\n    let railStyle, mainStyle, contentWrapStyle;\n    if(isM){\n      const open = st.drawerOpen;\n      railStyle = `position:fixed;top:0;left:0;bottom:0;width:300px;max-width:85vw;z-index:100;display:flex;${railBase}transform:translateX(${open?'0':'-110%'});transition:transform .25s ease;box-shadow:${open?'8px 0 24px rgba(0,0,0,.2)':'none'}`;\n      mainStyle = `flex:1;min-width:0;overflow-y:auto;height:100vh;padding-top:64px;background:#f2f2f2`;\n      contentWrapStyle = `max-width:760px;margin:0 auto;padding:28px 18px 90px`;\n    } else {\n      railStyle = `position:sticky;top:0;height:100vh;width:330px;flex:0 0 330px;display:flex;${railBase}`;\n      mainStyle = `flex:1;min-width:0;overflow-y:auto;height:100vh;background:#f2f2f2`;\n      contentWrapStyle = `max-width:none;margin:0;padding:46px 56px 110px`;\n    }\n\n    return {\n      noop: ()=>{},\n      isMobile:isM,\n      drawerOpen:st.drawerOpen,\n      showOverlay: isM && st.drawerOpen,\n      toggleDrawer: ()=>this.setState(s=>({drawerOpen:!s.drawerOpen})),\n      closeDrawer: ()=>this.setState({drawerOpen:false}),\n      railStyle, mainStyle, contentWrapStyle,\n      showProgress,\n      introNav,\n\n      overallPct: pct+'%',\n      overallLabel: `${done} of ${total} done`,\n      progressFillStyle:`height:100%;width:${pct}%;background:#287c34;border-radius:100px;transition:width .35s ease`,\n\n      modules,\n      units,\n\n      isIntro: introActive,\n      notIntro: !introActive,\n      activeModuleLabel: introActive ? 'Course overview' : mod.title,\n      activeUnitLabel: introActive ? '' : ((this.units.find(u=>u.id===mod.unit)||{}).label||'') + ' · ' + ((this.units.find(u=>u.id===mod.unit)||{}).title||''),\n      kickerStyle:`background:${accent};border:2px solid #222;border-radius:100px;font:700 12px/1 'Lexend';letter-spacing:.04em;text-transform:uppercase;padding:6px 13px;color:#222`,\n      sectionCountLabel:`Section ${secIdx+1} of ${mod.sections.length}`,\n      activeSectionTitle: sec.title,\n      accentBarStyle:`width:64px;height:6px;border-radius:100px;background:#222;margin-top:6px`,\n\n      blocks,\n\n      hasPrev: ordIdx>0,\n      onPrev: ()=>this.prevSection(),\n      onComplete: ()=>this.completeAndNext(),\n      completeLabel: introActive ? 'Start the course' : (isLast ? (secDone?'Finish course':'Complete & finish') : (secDone?'Next section':'Complete & continue')),\n      completeBtnStyle:`border:2px solid #222;border-radius:8px;background:${(!introActive && secDone)?'#287c34':'#222'};color:#fff;font:700 15px/1 'Lexend';padding:12px 22px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:2px 2px 0 #ffe555`\n    };\n  }\n\n  resolveAsset(p){\n    if(typeof p!=='string') return p;\n    const r = (typeof window!=='undefined' && window.__resources) || {};\n    if(p.indexOf('learning-framework.png')>=0 && r.learningFramework) return r.learningFramework;\n    if(p.indexOf('Oak-planning-tool-2024.pdf')>=0 && r.planningToolPdf) return r.planningToolPdf;\n    return p;\n  }\n\n  enrich(b, bi, accent, accentStrong){\n    const key=this.ukey(bi);\n    const base={isHeading:false,isText:false,isCallout:false,isImage:false,isVideo:false,isAccordion:false,isTabs:false,isFlip:false,isCompare:false,isHotspot:false,isSortable:false,isQuiz:false,isCourseMap:false,isSummary:false,isStats:false,isDownload:false};\n    const mediaBox=`position:relative;border:3px solid #222;border-radius:16px;background:#f9f9f9;box-shadow:4px 4px 0 #ffe555;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px`;\n\n    if(b.t==='heading') return {...base,isHeading:true,text:b.text};\n    if(b.t==='text') return {...base,isText:true,paras:b.paras};\n    if(b.t==='summary') return {...base,isSummary:true,points:b.points,question:b.question};\n\n    if(b.t==='stats'){\n      const n=b.items.length;\n      const cols = this.state.isMobile ? 2 : (n>=4?4:n);\n      const palette=['#bef2bd','#a0b6f2','#b0e2de','#deb7d5','#fff2aa','#ffc8a6','#cdbdf2'];\n      return {...base,isStats:true,\n        hasIntro:!!b.intro, intro:b.intro||'',\n        hasNote:!!b.note, note:b.note||'',\n        gridStyle:`display:grid;grid-template-columns:repeat(${cols},1fr);gap:12px`,\n        items: b.items.map((it,ii)=>({value:it.value, label:it.label,\n          cardStyle:`border:2px solid #222;border-radius:12px;background:${it.bg||palette[ii%palette.length]};box-shadow:2px 2px 0 #ffe555;padding:16px 16px 18px`\n        }))\n      };\n    }\n\n    if(b.t==='download'){\n      return {...base,isDownload:true,\n        href:this.resolveAsset(b.href), filename:b.filename||'', title:b.title, desc:b.desc||'', meta:b.meta||'PDF'};\n    }\n\n    if(b.t==='coursemap'){\n      const key=this.ukey(bi);\n      const active=this.getUI(key,0);\n      return {...base,isCourseMap:true,\n        units: this.units.map((u,ui)=>{\n          const sel = ui===active;\n          const mods=this.state.course.filter(m=>m.unit===u.id);\n          return { label:u.label, title:u.title, selected:sel,\n            tabLabel:`${u.label} · ${u.title}`,\n            onClick: ()=>this.setUI(key,ui),\n            tabStyle:`border:none;border-bottom:4px solid ${sel?'#222':'transparent'};background:${sel?'#fff':'transparent'};font:${sel?'700':'400'} 15px/1.3 'Lexend';color:#222;padding:14px 18px;cursor:pointer;transition:background .12s;text-align:left`,\n            mapCards: mods.map((m,mi)=>({\n              title:m.title,\n              num:String(mi+1),\n              count: m.sections.length + ' sections',\n              outcomes: m.outcomes||[],\n              onClick: ()=>this.navTo(m.id, m.sections[0].id),\n              dotStyle:`width:32px;height:32px;flex:0 0 auto;border-radius:100px;border:2px solid #222;background:${m.color};display:flex;align-items:center;justify-content:center;font:700 15px/1 'Lexend'`\n            }))\n          };\n        })\n      };\n    }\n\n    if(b.t==='callout'){\n      const map={\n        quote:{bg:'#fff7cc',bd:'#ffe555',icon:'\\u201C',iconBg:'#ffe555'},\n        info:{bg:'#e3e9fb',bd:'#a0b6f2',icon:'i',iconBg:'#a0b6f2'},\n        tip:{bg:'#ebfbeb',bd:'#93e892',icon:'\\u2605',iconBg:'#bef2bd'},\n        warning:{bg:'#ffece0',bd:'#ff934e',icon:'!',iconBg:'#ff934e'}\n      };\n      const c=map[b.variant]||map.info;\n      const isQuote=b.variant==='quote';\n      return {...base,isCallout:true,\n        text:b.text, title:b.title||'', hasTitle:!!b.title,\n        attrib:b.attrib||'', hasAttrib:!!b.attrib,\n        calloutStyle:`display:flex;gap:14px;border:2px solid #222;border-left:8px solid ${c.bd};border-radius:12px;background:${c.bg};padding:18px 20px`,\n        calloutIcon:c.icon,\n        calloutIconStyle:`width:34px;height:34px;flex:0 0 auto;border-radius:100px;border:2px solid #222;background:${c.iconBg};display:flex;align-items:center;justify-content:center;font:700 18px/1 'Lexend';color:#222`,\n        calloutTextStyle: isQuote? `font:400 20px/29px 'Lexend';font-style:italic;color:#222` : `font:300 17px/26px 'Lexend';color:#222`\n      };\n    }\n\n    if(b.t==='image') return {...base,isImage:true,caption:b.caption,placeholder:b.placeholder,src:b.src||'',hasSrc:!!b.src,noSrc:!b.src,mediaBoxStyle:mediaBox,\n      imgEl: b.src ? React.createElement('img',{src:this.resolveAsset(b.src),alt:b.alt||b.caption||'',style:{display:'block',width:'100%',maxWidth:b.maxWidth||'none',margin:b.maxWidth?'0 auto':'0',height:'auto',border:'3px solid #222',borderRadius:'16px',boxShadow:'4px 4px 0 #ffe555'}}) : null};\n    if(b.t==='video') return {...base,isVideo:true,caption:b.caption,placeholder:b.placeholder,mediaBoxStyle:mediaBox};\n\n    if(b.t==='accordion'){\n      return {...base,isAccordion:true,\n        chipStyle:`width:30px;height:30px;flex:0 0 auto;border-radius:100px;border:2px solid #222;background:${b.chip||accent};display:flex;align-items:center;justify-content:center;font:700 14px/1 'Lexend'`,\n        items: b.items.map(it=>{\n          const im = it.img || null;\n          return {q:it.q, badge:it.badge||'', a:it.a, hasFeatures:!!(it.features&&it.features.length), features:it.features||[],\n            hasImg: !!im,\n            imgPlaceholder: im ? (im.placeholder||'Image') : '',\n            imgSrc: (im && im.src) ? im.src : '',\n            imgHasSrc: !!(im && im.src),\n            imgNoSrc: !!(im && !im.src),\n            imgEl: (im && im.src) ? React.createElement('img',{src:im.src,alt:im.alt||im.placeholder||'',style:{display:'block',width:'100%',maxWidth:'440px',height:'auto',border:'2px solid #222',borderRadius:'12px',boxShadow:'2px 2px 0 #ffe555'}}) : null\n          };\n        })\n      };\n    }\n\n    if(b.t==='tabs'){\n      const active=this.getUI(key,0);\n      return {...base,isTabs:true,\n        tabs: b.tabs.map((t,ti)=>{\n          const sel=ti===active;\n          return {label:t.label, selected:sel,\n            onClick:()=>this.setUI(key,ti),\n            btnStyle:`border:none;border-bottom:4px solid ${sel?'#222':'transparent'};background:${sel?'#fff':'transparent'};font:${sel?'700':'400'} 15px/1.3 'Lexend';color:#222;padding:14px 18px;cursor:pointer;transition:background .12s`,\n            paras:t.paras, example:t.example||'', hasExample:!!t.example, exampleTag:''\n          };\n        })\n      };\n    }\n\n    if(b.t==='flip'){\n      const flips=this.getUI(key,{});\n      const lastFlip=this.state.ui.lastFlip;\n      const cols = b.cards.length>=3 ? 3 : b.cards.length;\n      return {...base,isFlip:true,\n        flipGridStyle:`display:grid;grid-template-columns:repeat(${this.state.isMobile?1:cols}, 1fr);gap:16px`,\n        chipStyle:`width:34px;height:34px;flex:0 0 auto;border-radius:100px;border:2px solid #222;background:${b.chip||accent};display:flex;align-items:center;justify-content:center;font:700 15px/1 'Lexend'`,\n        cards: b.cards.map((c,ci)=>{\n          const f=!!flips[ci];\n          const ckey=key+':'+ci;\n          const animate = lastFlip===ckey;\n          const tf = `transform:rotateY(${f?'180deg':'0deg'})`;\n          const transform3d = animate\n            ? `animation:${f?'oakFlipIn':'oakFlipOut'} .5s ease forwards;${tf}`\n            : tf;\n          return {badge:c.badge||'', front:c.front, back:c.back, flipped:f,\n            aria:`${c.front}. ${f?'Showing detail':'Tap to reveal detail'}`,\n            onFlip:()=>{\n              const nf={...flips,[ci]:!f};\n              this.setState(s=>({ui:{...s.ui,[key]:nf,lastFlip:ckey}}));\n              clearTimeout(this._flipT);\n              this._flipT=setTimeout(()=>this.setState(s=>({ui:{...s.ui,lastFlip:null}})),520);\n            },\n            outerStyle:`position:relative;border:none;background:transparent;padding:0;cursor:pointer;min-height:210px;perspective:1200px;font-family:'Lexend'`,\n            innerStyle:`position:relative;width:100%;height:100%;min-height:210px;transform-style:preserve-3d;${transform3d}`,\n            frontStyle:`position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid #222;border-radius:14px;background:#fff;box-shadow:2px 2px 0 #ffe555;padding:18px;display:flex;flex-direction:column;align-items:flex-start;text-align:left`,\n            backStyle:`position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);border:2px solid #222;border-radius:14px;background:${b.chip||accent};box-shadow:2px 2px 0 #222;padding:18px;display:flex;align-items:flex-start;text-align:left;overflow:auto`\n          };\n        })\n      };\n    }\n\n    if(b.t==='compare'){\n      return {...base,isCompare:true,\n        compareGridStyle:`display:grid;grid-template-columns:repeat(${this.state.isMobile?1:2},1fr);gap:16px`,\n        goodText:b.goodText, hasGoodImg:!!b.goodImg, goodImg:b.goodImg||'', hasGoodNote:!!b.goodNote, goodNote:b.goodNote||'',\n        badText:b.badText, hasBadImg:!!b.badImg, badImg:b.badImg||'', hasBadNote:!!b.badNote, badNote:b.badNote||''\n      };\n    }\n\n    if(b.t==='hotspot'){\n      const active=this.getUI(key,0);\n      const positions=[{x:'26%',y:'34%'},{x:'52%',y:'58%'},{x:'76%',y:'38%'},{x:'40%',y:'72%'},{x:'64%',y:'24%'}];\n      return {...base,isHotspot:true,\n        placeholder:b.placeholder,\n        spots: b.spots.map((sp,si)=>{\n          const p=positions[si]||{x:'50%',y:'50%'};\n          const on=si===active;\n          return {num:String(si+1), aria:`${sp.title}`,\n            onClick:()=>this.setUI(key,si),\n            markerStyle:`position:absolute;left:${p.x};top:${p.y};transform:translate(-50%,-50%) scale(${on?1.15:1});width:40px;height:40px;border-radius:100px;border:3px solid #222;background:${on?'#ffe555':'#fff'};box-shadow:${on?'0 0 0 4px rgba(255,229,85,.6)':'2px 2px 0 #222'};font:700 17px/1 'Lexend';cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:2`\n          };\n        }),\n        activeNum:String(active+1), activeTitle:b.spots[active].title, activeText:b.spots[active].text\n      };\n    }\n\n    if(b.t==='sortable'){\n      const cur=this.getUI(key, b.items.map(x=>x.id));\n      const checked=this.getUI(key+':checked', null);\n      const itemById=id=>b.items.find(x=>x.id===id);\n      const move=(from,to)=>{\n        if(to<0||to>=cur.length) return;\n        const arr=cur.slice(); const [m]=arr.splice(from,1); arr.splice(to,0,m);\n        this.setState(s=>({ui:{...s.ui,[key]:arr,[key+':checked']:null}}));\n      };\n      const isCorrect = JSON.stringify(cur)===JSON.stringify(b.correct);\n      return {...base,isSortable:true,\n        prompt:b.prompt,\n        order: cur.map((id,idx)=>{\n          const it=itemById(id);\n          return {text:it.text, pos:String(idx+1),\n            style:`display:flex;align-items:center;gap:12px;border:2px solid #222;border-radius:10px;background:#fff;padding:11px 13px`,\n            onUp:()=>move(idx,idx-1),\n            onDown:()=>move(idx,idx+1),\n            onDragStart:(e)=>{this._drag={key,idx};},\n            onDragOver:(e)=>{e.preventDefault();},\n            onDrop:(e)=>{e.preventDefault(); if(this._drag&&this._drag.key===key){ move(this._drag.idx, idx); this._drag=null;}}\n          };\n        }),\n        onCheck: ()=>this.setState(s=>({ui:{...s.ui,[key+':checked']:true}})),\n        showResult: checked!==null,\n        resultText: isCorrect? '✓ Correct — that\\u2019s the order learning happens.' : 'Not quite — adjust and check again.',\n        resultStyle: isCorrect? `font:700 15px/1.3 'Lexend';color:#287c34` : `font:700 15px/1.3 'Lexend';color:#dd0035`\n      };\n    }\n\n    if(b.t==='quiz'){\n      return {...base,isQuiz:true,\n        title:b.title,\n        questions: b.questions.map((q,qi)=>{\n          const qkey=key+':q'+qi;\n          const sel=this.getUI(qkey, null);\n          const answered=sel!==null;\n          const correctIdx=q.options.findIndex(o=>o.correct);\n          const isRight=sel===correctIdx;\n          return {num:String(qi+1), stem:q.stem,\n            optionsWrapStyle: q.kind==='tf' ? `display:flex;gap:10px;flex-wrap:wrap` : `display:flex;flex-direction:column;gap:9px`,\n            options: q.options.map((o,oi)=>{\n              let bg='#fff', bd='#222', mark='', markBg='#fff', markColor='#222';\n              const letter=String.fromCharCode(97+oi);\n              if(answered){\n                if(o.correct){ bg='#dff9de'; bd='#287c34'; mark='✓'; markBg='#287c34'; markColor='#fff'; }\n                else if(oi===sel){ bg='#f8d8e0'; bd='#dd0035'; mark='✕'; markBg='#dd0035'; markColor='#fff'; }\n                else { bg='#f9f9f9'; }\n              }\n              return {text:o.text,\n                onClick: answered? (()=>{}) : (()=>this.setUI(qkey,oi)),\n                style:`display:flex;align-items:center;gap:11px;${q.kind==='tf'?'flex:1;min-width:130px;justify-content:center;':''}border:2px solid ${bd};border-radius:10px;background:${bg};padding:12px 14px;cursor:${answered?'default':'pointer'};text-align:left;transition:background .12s`,\n                markChar: answered? mark : letter,\n                markStyle:`width:26px;height:26px;flex:0 0 auto;border-radius:${q.kind==='tf'?'6px':'100px'};border:2px solid ${answered&&(o.correct||oi===sel)?bd:'#222'};background:${answered&&(o.correct||oi===sel)?markBg:'#fff'};color:${answered&&(o.correct||oi===sel)?markColor:'#222'};display:flex;align-items:center;justify-content:center;font:700 13px/1 'Lexend';text-transform:uppercase`\n              };\n            }),\n            answered,\n            feedbackS
