document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  --oak-lemon30: #fff7cc;\n  --oak-lemon50: #fff2aa;\n  --oak-lemon110: #fbd60e;\n\n  /* --- Functional --- */\n  --oak-amber: #ff934e;\n  --oak-amber30: #ffece0;\n  --oak-amber50: #ffc8a6;\n  --oak-red: #dd0035;\n  --oak-red30: #f8d8e0;\n  --oak-red50: #ee809a;\n  --oak-navy: #0d24c4;\n  --oak-navy110: #0a1d9d;\n  --oak-navy120: #081676;\n\n  /* --- Teaching resources only (slides etc) --- */\n  --oak-blue: #374cf1;\n  --oak-magenta: #d02aa7;\n  --oak-purple: #845ad9;\n  --oak-teal: #037b7d;\n\n  /* --- Semantic role tokens (default theme) --- */\n  --text-primary: var(--oak-black);\n  --text-subdued: var(--oak-grey60);\n  --text-error: var(--oak-red);\n  --text-disabled: var(--oak-grey50);\n  --text-link: var(--oak-navy);\n  --text-link-hover: var(--oak-navy110);\n  --text-link-visited: var(--oak-navy120);\n  --text-inverted: var(--oak-white);\n  --text-success: var(--oak-green);\n\n  --bg-primary: var(--oak-white);\n  --bg-inverted: var(--oak-black);\n  --bg-neutral: var(--oak-grey20);\n  --bg-neutral-stronger: var(--oak-grey30);\n  --bg-btn-primary: var(--oak-black);\n  --bg-btn-primary-hover: var(--oak-grey60);\n  --bg-btn-secondary: var(--oak-white);\n  --bg-btn-secondary-hover: var(--oak-grey20);\n\n  --bg-correct: var(--oak-mint50);\n  --bg-incorrect: var(--oak-red30);\n  --bg-success: var(--oak-green);\n  --bg-error: var(--oak-red);\n\n  --border-primary: var(--oak-black);\n  --border-neutral: var(--oak-grey50);\n  --border-neutral-lighter: var(--oak-grey40);\n  --border-brand: var(--oak-green);\n  --border-error: var(--oak-red);\n  --border-warning: var(--oak-amber);\n\n  /* --- Border widths --- */\n  --border-solid-none: 0; /* @kind spacing */\n  --border-solid-s: 1px;\n  --border-solid-m: 2px;\n  --border-solid-l: 3px;\n  --border-solid-xl: 4px;\n  --border-solid-xxl: 6px;\n  --border-solid-xxxl: 8px;\n  --border-solid-xxxxl: 10px;\n\n  /* --- Border radii --- */\n  --radius-square: 0;\n  --radius-xs: 2px;\n  --radius-s: 4px;\n  --radius-m: 6px;\n  --ra p:10px;margin-bottom:18px\">\n                  <span style=\"width:34px;height:34px;border-radius:100px;background:#ffe555;border:2px solid #222;display:flex;align-items:center;justify-content:center;font-size:18px\">?<\u002Fspan>\n                  <span style=\"font:700 20px/26px 'Lexend'\">{{ block.title }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:24px\">\n                  <sc-for list=\"{{ block.questions }}\" as=\"q\" hint-placeholder-count=\"2\">\n                    <div>\n                      <div style=\"display:flex;gap:10px;margin-bottom:12px\">\n                        <span style=\"font:700 16px/24px 'Lexend';color:#575757;flex:0 0 auto\">Q{{ q.num }}<\u002Fspan>\n                        <span style=\"font:600 18px/25px 'Lexend'\">{{ q.stem }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"{{ q.optionsWrapStyle }}\">\n                        <sc-for list=\"{{ q.options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                          <button onclick=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\">\n                            <span style=\"{{ opt.markStyle }}\">{{ opt.markChar }}<\u002Fspan>\n                            <span style=\"flex:1;text-align:left;font:300 16px/22px 'Lexend'\">{{ opt.text }}<\u002Fspan>\n                          <\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ q.answered }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"{{ q.feedbackStyle }}\">\n                          <span style=\"font:700 14px/20px 'Lexend'\">{{ q.feedbackLabel }}<\u002Fspan>\n                          <span style=\"font:300 15px/22px 'Lexend'\"> {{ q.explain }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- SUMMARY -->\n            <sc-if value=\"{{ block.isSummary }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:16px\">\n                <div style=\"border:2px solid #222;border-radius:14px;background:#fff;box-shadow:2px 2px 0 #ffe555;padding:20px 22px 22px\">\n                  <div style=\"font:700 13px/1 'Lexend';letter-spacing:.04em;text-transform:uppercase;color:#575757;margin-bottom:14px\">Key takeaways<\u002Fdiv>\n                  <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px\">\n                    <sc-for list=\"{{ block.points }}\" as=\"pt\" hint-placeholder-count=\"3\">\n                      <li style=\"display:flex;gap:12px;align-items:flex-start;font:300 17px/26px 'Lexend';max-width:66ch\"><span style=\"color:#287c34;font-weight:700;flex:0 0 auto;font-size:19px;line-height:26px\">✓<\u002Fspan><span>{{ pt }}<\u002Fspan><\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Ful>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:14px;border:2px solid #222;border-left:8px solid #ffe555;border-radius:12px;background:#fff7cc;padding:18px 20px\">\n                  <div style=\"width:36px;height:36px;flex:0 0 auto;border-radius:100px;border:2px solid #222;background:#ffe555;display:flex;align-items:center;justify-content:center;font:700 18px/1 'Lexend';color:#222\">?<\u002Fdiv>\n                  <div style=\"flex:1\">\n                    <div style=\"font:700 13px/1 'Lexend';letter-spacing:.04em;text-transform:uppercase;color:#222;margin-bottom:6px\">Reflect as you design<\u002Fdiv>\n                    <div style=\"font:400 18px/27px 'Lexend';color:#222;max-width:62ch\">{{ block.question }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- STATS -->\n            <sc-if value=\"{{ block.isStats }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <sc-if value=\"{{ block.hasIntro }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"font:300 18px/29px 'Lexend';letter-spacing:-.005rem;margin:0 0 16px;max-width:68ch\">{{ block.intro }}<\u002Fp>\n                <\u002Fsc-if>\n                <div style=\"{{ block.gridStyle }}\">\n                  <sc-for list=\"{{ block.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n                    <div style=\"{{ it.cardStyle }}\">\n                      <div style=\"font:700 30px/1 'Lexend';color:#222\">{{ it.value }}<\u002Fdiv>\n                      <div style=\"font:300 14px/19px 'Lexend';color:#222;margin-top:7px\">{{ it.label }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-if value=\"{{ block.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"font:300 13px/19px 'Lexend';color:#575757;margin:13px 0 0\">{{ block.note }}<\u002Fp>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- DOWNLOAD -->\n            <sc-if value=\"{{ block.isDownload }}\" hint-placeholder-val=\"{{ false }}\">\n              <a href=\"{{ block.href }}\" download=\"{{ block.filename }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:16px;text-decoration:none;border:3px solid #222;border-radius:14px;background:#fff;box-shadow:4px 4px 0 #ffe555;padding:18px 20px;color:#222;flex-wrap:wrap\">\n                <div style=\"width:50px;height:58px;flex:0 0 auto;border:2px solid #222;border-radius:8px;background:#fff7cc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px\">\n                  <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><\u002Fsvg>\n                  <span style=\"font:700 9px/1 'Lexend';letter-spacing:.06em\">PDF<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:180px\">\n                  <div style=\"font:700 18px/24px 'Lexend'\">{{ block.title }}<\u002Fdiv>\n                  <div style=\"font:300 15px/22px 'Lexend';color:#575757;margin-top:3px\">{{ block.desc }}<\u002Fdiv>\n                  <div style=\"font:700 13px/1 'Lexend';color:#575757;margin-top:9px\">{{ block.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"flex:0 0 auto;display:flex;align-items:center;gap:8px;border:2px solid #222;border-radius:8px;background:#222;color:#fff;font:700 14px/1 'Lexend';padding:11px 16px\">Download <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><path d=\"M7 10l5 5 5-5\"><\u002Fpath><path d=\"M12 15V3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- section footer nav -->\n      <div style=\"margin-top:14px;padding-top:24px;border-top:2px solid #e4e4e4;display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n        <sc-if value=\"{{ hasPrev }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ onPrev }}\" style=\"border:2px solid #222;border-radius:8px;background:#fff;color:#222;font:700 15px/1 'Lexend';padding:12px 18px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:2px 2px 0 #ffe555\"><span style=\"font-size:17px\">←<\u002Fspan> Previous<\u002Fbutton>\n        <\u002Fsc-if>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <button onclick=\"{{ onComplete }}\" style=\"{{ completeBtnStyle }}\">{{ completeLabel }} <span style=\"font-size:17px\">→<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accentMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Per module&quot;,&quot;Uniform mint&quot;],&quot;default&quot;:&quot;Per module&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showProgress&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;persistProgress&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    const c = this.buildCourse();\n    this.intro = this.buildIntro();\n    this.units = [\n      {id:'u1', label:'Unit 1', title:'Planning lessons at Oak'},\n      {id:'u2', label:'Unit 2', title:'Designing high-quality explanation & checks for understanding'}\n    ];\n    let completed = {};\n    let last = null;\n    const persistOn = this.props.persistProgress !== false;\n    try {\n      if(persistOn){\n        completed = JSON.parse(localStorage.getItem('oakCourseProgress')||'{}') || {};\n        last = JSON.parse(localStorage.getItem('oakCourseLast')||'null');\n      }\n    } catch(e){}\n    const valid = last && last.m && (\n      last.m==='intro'\n        ? last.s==='introMain'\n        : (c.find(m=>m.id===last.m)||{sections:[]}).sections.some(s=>s.id===last.s)\n    );\n    const am = (valid && last.m) || 'intro';\n    const as = (valid && last.s) || 'introMain';\n    this.state = {\n      course: c,\n      activeModule: am,\n      activeSection: as,\n      openModule: (am!=='intro') ? am : null,\n      completed: completed,\n      isMobile: false,\n      drawerOpen: false,\n      ui: {}, // per-block-key state\n    };\n    this._drag = null;\n  }\n\n  componentDidMount(){\n    this._mq = window.matchMedia('(max-width: 880px)');\n    const apply = () => this.setState({ isMobile: this._mq.matches });\n    apply();\n    this._mqHandler = apply;\n    this._mq.addEventListener ? this._mq.addEventListener('change', apply) : this._mq.addListener(apply);\n  }\n  componentWillUnmount(){\n    if(this._mq){ this._mq.removeEventListener ? this._mq.removeEventListener('change', this._mqHandler) : this._mq.removeListener(this._mqHandler); }\n  }\n\n  persist(){\n    if(this.props.persistProgress === false) return;\n    try {\n      localStorage.setItem('oakCourseProgress', JSON.stringify(this.state.completed));\n      localStorage.setItem('oakCourseLast', JSON.stringify({m:this.state.activeModule, s:this.state.activeSection}));\n    } catch(e){}\n  }\n\n  // ---- navigation ----\n  getModule(id){ return id==='intro' ? this.intro : (this.state.course.find(m=>m.id===id)||this.state.course[0]); }\n  flatSections(){\n    const out=[];\n    this.state.course.forEach(m => m.sections.forEach(s => out.push({m:m.id, s:s.id})));\n    return out;\n  }\n  navOrder(){\n    const out=[{m:'intro', s:'introMain'}];\n    this.state.course.forEach(m => m.sections.forEach(s => out.push({m:m.id, s:s.id})));\n    return out;\n  }\n  navTo(mid, sid){\n    this.setState({activeModule:mid, activeSection:sid, openModule:(mid==='intro'?null:mid), drawerOpen:false}, ()=>{\n      this.persist();\n      const main = document.getElementById('main');\n      if(main) main.scrollTop = 0;\n    });\n  }\n  toggleModule(mid){\n    const m = this.state.course.find(x=>x.id===mid);\n    if(this.state.openModule===mid){ this.setState({openModule:null}); }\n    else { this.navTo(mid, m.sections[0].id); }\n  }\n  prevSection(){\n    const ord=this.navOrder();\n    const i=ord.findIndex(x=>x.m===this.state.activeModule && x.s===this.state.activeSection);\n    if(i>0) this.navTo(ord[i-1].m, ord[i-1].s);\n  }\n  completeAndNext(){\n    if(this.state.activeModule==='intro'){\n      const fm=this.state.course[0];\n      this.navTo(fm.id, fm.sections[0].id);\n      return;\n    }\n    const sid=this.state.activeSection;\n    const completed={...this.state.completed, [sid]:true};\n    const flat=this.flatSections();\n    const i=flat.findIndex(x=>x.m===this.state.activeModule && x.s===sid);\n    this.setState({completed}, ()=>{\n      this.persist();\n      if(i < flat.length-1){ this.navTo(flat[i+1].m, flat[i+1].s); }\n      else { const main=document.getElementById('main'); if(main) main.scrollTop=0; }\n    });\n  }\n\n  // ---- per-block ui state helpers ----\n  ukey(bi){ return this.state.activeSection + ':' + bi; }\n  getUI(key, def){ return (this.state.ui[key]===undefined)? def : this.state.ui[key]; }\n  setUI(key, val){ this.setState(s=>({ui:{...s.ui, [key]:val}})); }\n\n  // ============ CONTENT ============\n  buildIntro(){\n    return { id:'intro', title:'Welcome & overview', color:'#fff2aa', sections:[\n      { id:'introMain', title:'Welcome to the course', blocks:[\n        {t:'callout', variant:'tip', title:'Welcome', text:\"We're going to help you plan and create high-quality lessons at Oak — from understanding what an Oak lesson is, to designing brilliant explanations and checks for understanding. Work through each module at your own pace; your progress is saved automatically.\"},\n        {t:'text', paras:[\n          \"This course has two units. The first, Planning lessons at Oak, covers what makes up an Oak lesson, the curriculum information you start from, and the core considerations that keep every lesson safe and inclusive.\",\n          \"The second, Designing high-quality explanation & checks for understanding, goes deep on the learning framework and the craft of explaining and checking. Use the menu below to explore, or follow the units in order using the navigation on the left.\"\n        ]},\n        {t:'video', caption:'Course introduction from the curriculum team.', placeholder:'Drop your intro video here (MP4 or embed).'},\n        {t:'heading', text:'What you\\u2019ll learn'},\n        {t:'coursemap'},\n        {t:'callout', variant:'info', title:'A note on language', text:\"Throughout, we say pupils (never students or learners), and headings are in sentence case — both part of Oak's house style.\"}\n      ]}\n    ]};\n  }\n\n  buildCourse(){\n    return [\n      // ============================================================\n      // ===================== UNIT 1 · PLANNING ====================\n      // ============================================================\n\n      // ---- U1 · MODULE 1: Oak lessons ----\n      { id:'u1m1', unit:'u1', title:'Oak lessons', color:'#ffc8a6', colorStrong:'#ff934e', outcomes:[\n        'Describe the eight components of an Oak lesson and how they work together',\n        'Explain the lesson creation process, duration and structure',\n        'Use Oak\\u2019s shared vocabulary: outcome, outline, learning cycle and key learning points'\n      ], sections:[\n        { id:'u1m1s1', title:'Why Oak lessons matter', blocks:[\n          {t:'text', paras:[\n            \"Lessons at Oak reach an enormous number of classrooms \\u2014 which is exactly why they're planned and created by expert teachers like you.\",\n            \"In a typical week during the 2022 school year, Oak was used at remarkable scale. And teachers reach for the same lesson in very different ways, so there's no single 'right' way to use one.\"\n          ]},\n          {t:'stats', intro:'In the 2022 school year, Oak reached classrooms at scale:', items:[\n            {value:'102,000', label:'pupils used the website each week'},\n            {value:'30,000', label:'teachers used the website each week'},\n            {value:'1.13m', label:'resources downloaded by teachers'},\n            {value:'9.6m', label:'lessons taken by pupils'}\n          ]},\n          {t:'heading', text:'How a single lesson gets used'},\n          {t:'stats', intro:'One lesson is put to work in many different ways:', items:[\n            {value:'47%', label:'Lesson planning'},\n            {value:'43%', label:'Curriculum planning'},\n            {value:'38%', label:'Setting homework'},\n            {value:'32%', label:'Setting cover'},\n            {value:'31%', label:'Using slides in lessons'},\n            {value:'30%', label:'Setting remote learning'},\n            {value:'27%', label:'Professional development'}\n          ], note:'A teacher may use a lesson in more than one way, so these don\\u2019t add up to 100%.'},\n          {t:'text', paras:[\"With such a wide range of uses, Oak turns each lesson you create into two digital products.\"]},\n          {t:'flip', chip:'#ffc8a6', cards:[\n            {badge:'1', front:'Downloadable teaching resources', back:\"For teachers to deliver the lesson in their own classroom \\u2014 slides, worksheets and quizzes they can adapt and use however suits them.\"},\n            {badge:'2', front:'Online lessons', back:\"Focused on pupils being able to study the lesson remotely, working through the video, quizzes and worksheet at their own pace.\"}\n          ]}\n        ]},\n        { id:'u1m1s2', title:'The eight lesson components', blocks:[\n          {t:'text', paras:[\"Every Oak lesson is made up of eight components. They complement each other but can also be used independently \\u2014 a teacher might download just the worksheet, or play only the video. Expand each to see what it does.\"]},\n          {t:'accordion', chip:'#ffc8a6', items:[\n            {q:'Curriculum information', badge:'1', a:[\"All the information that, alongside the other components, makes up a full curriculum \\u2014 unit and lesson titles, key learning points, keywords and lesson outcomes. You review this before you start planning.\"]},\n            {q:'Slide deck', badge:'2', a:[\"The heart of the lesson. Suitable for in-class use and for the video, it provides the visual content that supports teaching.\"]},\n            {q:'Worksheet and answers', badge:'3', a:[\"Practice tasks for pupils, with a matching answers version. Created only once the slide deck has been formally reviewed.\"]},\n            {q:'Video', badge:'4', a:[\"A recorded version of the lesson for pupils studying remotely. Created after the slide deck is reviewed, as it depends on it.\"]},\n            {q:'Prior knowledge starter quiz', badge:'5', a:[\"A short quiz at the start that checks the prior knowledge pupils need to access the lesson \\u2014 part of the \\u2018Fit it\\u2019 and \\u2018Own it\\u2019 stages.\"]},\n            {q:'Exit assessment quiz', badge:'6', a:[\"An end-of-lesson quiz that assesses the key learning, helping to secure knowledge over time.\"]},\n            {q:'Additional materials', badge:'7', a:[\"Anything extra a lesson needs. Not every subject or lesson will have these.\"]},\n            {q:'Transcript', badge:'8', a:[\"A written record of the verbal content of the video, generated automatically.\"]}\n          ]},\n          {t:'callout', variant:'info', text:\"Lessons within a unit form a coherent whole, sequenced so content builds cumulatively \\u2014 and every lesson is suitable for both in-school delivery and remote learning, and can be adapted by the teacher.\"}\n        ]},\n        { id:'u1m1s3', title:'Duration & creation process', blocks:[\n          {t:'text', paras:[\"When taught in a classroom, Oak lessons are designed to fit a single timetabled slot \\u2014 including the time to complete the starter and exit quizzes.\"]},\n          {t:'stats', items:[\n            {value:'50\\u201360 min', label:'for KS2 to KS4'},\n            {value:'40 min', label:'for KS1'}\n          ]},\n          {t:'heading', text:'The creation process'},\n          {t:'text', paras:[\n            \"The components aren't built in a random order. This sequence is pedagogical, and it also supports the review process \\u2014 though your subject may need a slightly different approach.\",\n            \"Review curriculum information first, and keep returning to it. Build the slide deck alongside the additional materials and starter quiz to bind them together. Only create the worksheet and video once the slide deck has been formally reviewed, as both depend on it. The transcript is then generated automatically from the video.\"\n          ]},\n          {t:'image', caption:'The suggested order for creating each lesson component.', placeholder:'Lesson creation process diagram'},\n          {t:'download', title:'Oak lesson planning tool', desc:'A step-by-step planning template to map out each component as you build your lesson.', meta:'PDF \\u00b7 click to download', href:'assets/Oak-planning-tool-2024.pdf', filename:'Oak-planning-tool-2024.pdf'},\n          {t:'callout', variant:'tip', title:'Coherence is the hard part', text:\"Creating the slide deck alongside the additional materials and starter quiz helps hold the whole lesson together \\u2014 it's the aspect creators most often find challenging.\"}\n        ]},\n        { id:'u1m1s4', title:'Lesson structure & vocabulary', blocks:[\n          {t:'text', paras:[\n            \"Oak lessons are highly structured to support explicit teaching \\u2014 teaching in a structured, direct way where every part has clarity and pupils are shown how to succeed. Hattie's synthesis found explicit teaching has an average effect size of 0.59 on pupil achievement, benefiting all pupils.\",\n            \"The slide deck shows this structure most clearly. Its colours aren't decorative \\u2014 they carry meaning. Tap each to see what it signals.\"\n          ]},\n          {t:'flip', chip:'#ffc8a6', cards:[\n            {badge:'A', front:'Light green', back:\"Templated slides \\u2014 the design is fixed and shared across all lessons.\"},\n            {badge:'B', front:'Banner colour', back:\"On slides where creators have more design freedom, the banner colour signals which learning cycle the slide belongs to.\"},\n            {badge:'C', front:'Shaded background', back:\"Any slide that involves feedback to pupils has a shaded background.\"},\n            {badge:'D', front:'Sections', back:\"The deck is divided into sections that communicate the structure of the learning within the lesson.\"}\n          ]},\n          {t:'image', caption:'A whole KS2 art and design slide deck, showing the colour-coded structure.', placeholder:'Full slide deck overview'},\n          {t:'heading', text:'The vocabulary we use'},\n          {t:'text', paras:[\"It helps to share precise language for the parts of a lesson.\"]},\n          {t:'tabs', tabs:[\n            {label:'Lesson outcome', paras:[\"The aim of the lesson, which guides all planning. Pupil outcomes focus on the \\u2018takeaway\\u2019 \\u2014 the main task that secures pupils' learning.\"]},\n            {label:'Lesson outline', paras:[\"The overview of all the learning in the lesson, broken into learning cycles. Outline items are chunks of learning focused on a theme, idea or concept \\u2014 not necessarily objectives.\"]},\n            {label:'Learning cycle', paras:[\"A section of learning focused on one theme, indicated by colour in the deck. Each cycle runs explanation \\u2192 check for understanding \\u2192 practice \\u2192 feedback. Most lessons have between two and four.\"]},\n            {label:'Key learning points', paras:[\"Up to five (but minimal) important pieces of new knowledge the lesson must cover. They're part of curriculum information, published for teachers, and guide how the lesson is built.\"]}\n          ]}\n        ]},\n        { id:'u1m1s5', title:'Knowledge check', blocks:[\n          {t:'text', paras:[\"Check your understanding of Oak lessons before moving on.\"]},\n          {t:'quiz', title:'Quick check: Oak lessons', questions:[\n            {kind:'mcq', stem:'How many components make up a single Oak lesson?', options:[{text:'Five'},{text:'Eight', correct:true},{text:'Twelve'}], explain:'Eight: curriculum information, slide deck, worksheet & answers, video, starter quiz, exit quiz, additional materials and transcript.'},\n            {kind:'mcq', stem:'Which component should you create first?', options:[{text:'The video'},{text:'The worksheet'},{text:'The slide deck \\u2014 after reviewing curriculum information', correct:true}], explain:'Review curriculum information first, then build the slide deck. The worksheet and video come after the deck is reviewed.'},\n            {kind:'tf', stem:'A learning cycle runs explanation, check for understanding, practice, then feedback.', options:[{text:'True', correct:true},{text:'False'}], explain:'Each learning cycle starts with explanation, checked through CfUs, then practice and finally feedback.'}\n          ]}\n        ]},\n        { id:'u1m1s6', title:'Module summary', blocks:[\n          {t:'text', paras:[\"Carry these essentials forward as you start planning.\"]},\n          {t:'summary', points:[\n            \"Oak lessons reach classrooms at huge scale and are used in many ways, so each one becomes two products: downloadable resources and online lessons.\",\n            \"Every lesson has eight components, built in a deliberate order \\u2014 review curriculum information first, then the slide deck, then the worksheet and video.\",\n            \"Lessons are highly structured around learning cycles (explanation \\u2192 CfU \\u2192 practice \\u2192 feedback), with the slide deck's colours signalling that structure.\"\n          ], question:\"Thinking about your subject, which of the eight components will take the most thought to get right \\u2014 and where might your creation order differ from the suggested sequence?\"}\n        ]}\n      ]},\n\n      // ---- U1 · MODULE 2: Curriculum information ----\n      { id:'u1m2', unit:'u1', title:'Curriculum information', color:'#fff2aa', colorStrong:'#ffe555', outcomes:[\n        'Explain what curriculum information is and why it\\u2019s the \\u2018Fit it\\u2019 stage',\n        'Navigate curriculum information across sequence, unit and lesson levels',\n        'Know what to review, create and iterate in the Curriculum Authoring Tool'\n      ], sections:[\n        { id:'u1m2s1', title:'What is curriculum information?', blocks:[\n          {t:'text', paras:[\n            \"Before you plan any lessons, it's critical to engage with curriculum information. This is the \\u2018Fit it\\u2019 stage of our learning framework \\u2014 making sure pupils learn the right knowledge, in the right order.\",\n            \"Curriculum information is an umbrella term for all the information that, alongside the lesson components, creates a full curriculum. It's entered and stored in the Curriculum Authoring Tool (CAT) \\u2014 a system Oak built to design curricula and to update and store this information.\"\n          ]},\n          {t:'callout', variant:'info', text:\"Your Curriculum Development Leads have already entered some curriculum information into the CAT during curriculum development. You'll use it to help develop your lessons.\"},\n          {t:'text', paras:[\"Not everything can be added up front. Some information is best entered by the teacher planning the lesson, and lessons evolve as components are built \\u2014 so this information often needs refining afterwards too. That's why the process suggests reviewing curriculum information both before and after you develop a lesson's components.\"]}\n        ]},\n        { id:'u1m2s2', title:'The three levels', blocks:[\n          {t:'text', paras:[\"Curriculum information lives at three levels. Explore what sits at each.\"]},\n          {t:'tabs', tabs:[\n            {label:'Curriculum sequence', paras:[\"The big picture across a whole curriculum. Includes the curriculum explainer \\u2014 which helps a teacher picking up the curriculum understand its intention \\u2014 and threads, the links that create coherence and progression across units and lessons.\"], example:'Review the threads and curriculum explainer in the CAT before you start developing lessons.'},\n            {label:'Unit', paras:[\"The information that describes a unit: its title, planned number of lessons, prior knowledge requirements, national curriculum and exam board content, threads, a unit description, and \\u2018why this, why now\\u2019.\"], example:'\\u2018Why this, why now\\u2019 explains why a unit contains this content and why it sits at this point in the sequence.'},\n            {label:'Lesson', paras:[\"The detail for each lesson: title, key learning points, keywords, lesson outline, lesson outcome, misconceptions and responses, teacher tips and more. There's the most to do here \\u2014 some to review, some to create, some to iterate.\"], example:'Each lesson has up to five key learning points \\u2014 the main new knowledge pupils will learn.'}\n          ]}\n        ]},\n        { id:'u1m2s3', title:'Review, create or iterate', blocks:[\n          {t:'text', paras:[\"At lesson level, each piece of curriculum information needs a different action in the CAT. Some you review, some you create from scratch, and some you iterate as the lesson takes shape.\"]},\n          {t:'tabs', tabs:[\n            {label:'Review', paras:[\"Information that already exists and needs checking against the lesson you're building: lesson title, key learning points, keywords, misconception and misconception response, and copyright content. (In some subjects key learning points and keywords still need developing.)\"]},\n            {label:'Create', paras:[\"Information you'll write as you plan: lesson outline, tags, teacher tips, content guidance and supervision level, equipment and resources, and attribution.\"]},\n            {label:'Iterate', paras:[\"Information that's refined as the lesson develops \\u2014 most notably the lesson outcome, which focuses on the main task that secures pupils' learning and is best finalised once the lesson exists.\"]}\n          ]},\n          {t:'callout', variant:'warning', title:'Keep misconceptions central', text:\"Identifying likely misconceptions or common mistakes at the planning stage keeps them at the forefront of planning and delivery. Write the response as a suggested series of responses, not a script.\"}\n        ]},\n        { id:'u1m2s4', title:'Knowledge check', blocks:[\n          {t:'text', paras:[\"Check your understanding of curriculum information.\"]},\n          {t:'quiz', title:'Quick check: curriculum information', questions:[\n            {kind:'mcq', stem:'Which stage of the learning framework does engaging with curriculum information support?', options:[{text:'Fit it', correct:true},{text:'Use it'},{text:'Keep it'}], explain:'Curriculum information is the \\u2018Fit it\\u2019 stage \\u2014 making sure pupils learn the right knowledge.'},\n            {kind:'mcq', stem:'At how many levels does curriculum information exist?', options:[{text:'Two'},{text:'Three \\u2014 sequence, unit and lesson', correct:true},{text:'Five'}], explain:'Curriculum sequence, unit and lesson.'},\n            {kind:'tf', stem:'You only need to look at curriculum information once, before you start.', options:[{text:'True'},{text:'False', correct:true}], explain:'You review it before and after developing components, refining as the lesson evolves.'}\n          ]}\n        ]},\n        { id:'u1m2s5', title:'Module summary', blocks:[\n          {t:'text', paras:[\"The essentials to take into planning.\"]},\n          {t:'summary', points:[\n            \"Curriculum information is the \\u2018Fit it\\u2019 stage \\u2014 all the information that makes up a full curriculum, stored in the Curriculum Authoring Tool (CAT).\",\n            \"It exists at three levels: curriculum sequence, unit and lesson \\u2014 with the most to do at lesson level.\",\n            \"Review it before you plan and return to it afterwards, since some information is created and iterated as the lesson takes shape.\"\n          ], question:\"For your next unit, what prior knowledge do pupils need to access it \\u2014 and is that captured clearly in the curriculum information?\"}\n        ]}\n      ]},\n\n      // ---- U1 · MODULE 3: Core considerations ----\n      { id:'u1m3', unit:'u1', title:'Core considerations', color:'#cdbdf2', colorStrong:'#b29ce8', outcomes:[\n        'Apply accessibility and scaffolding so all pupils can access the learning',\n        'Enact diversity through inclusive language and imagery',\n        'Uphold safety, safeguarding and content guidance responsibilities'\n      ], sections:[\n        { id:'u1m3s1', title:'Five areas to consider', blocks:[\n          {t:'text', paras:[\"Several aspects of every Oak lesson exist to keep pupils and teachers safe and to uphold our moral and legal responsibilities. They fall into five areas \\u2014 tap each to see what it covers.\"]},\n          {t:'flip', chip:'#cdbdf2', cards:[\n            {badge:'1', front:'Accessibility', back:\"Lessons are created and designed to be accessible to all teachers and pupils \\u2014 meeting WCAG 2.1 AA, with strong colour contrast and clear, scaffolded design.\"},\n            {badge:'2', front:'Diversity', back:\"A curriculum principle: our content should be as positively diverse as the communities we serve, through inclusive language, imagery and the use of Oak characters.\"},\n            {badge:'3', front:'Safety', back:\"Where an activity could be dangerous, health and safety best practice is identified, addressed and modelled.\"},\n            {badge:'4', front:'Safeguarding', back:\"The same safeguarding principles and judgement as face-to-face teaching apply: age-appropriate content, no external links, and content warnings where needed.\"},\n            {badge:'5', front:'Content guidance', back:\"Sensitive, offensive, health-and-safety or safeguarding-related content is flagged in the CAT and shown on the lesson page for teachers and pupils.\"}\n          ]}\n        ]},\n        { id:'u1m3s2', title:'Accessibility & scaffolding', blocks:[\n          {t:'text', paras:[\"Good teaching for pupils with SEND is good teaching for all. Oak's templates already build in many accessibility measures \\u2014 a sans-serif font, left-aligned text, bold (not underline or italics) for keyword emphasis, captioning, signing and transcripts for videos, and colours checked by sector experts.\"]},\n          {t:'callout', variant:'info', title:'Quality standard', text:\"Lesson content must meet WCAG 2.1 AA, with a text-to-background contrast ratio of at least 4.5:1 \\u2014 already checked and built into the templates.\"},\n          {t:'text', paras:[\"One simple choice protects contrast: avoid coloured backgrounds behind text.\"]},\n          {t:'compare', goodText:'Text on a plain white background, keeping a strong contrast.', goodNote:'Meets the 4.5:1 contrast ratio comfortably.', badText:'Text placed on a coloured background.', badNote:'Risks dropping below the required contrast ratio.'},\n          {t:'heading', text:'Scaffolding'},\n          {t:'text', paras:[\"The EEF describes scaffolding as temporary support that's removed when it's no longer needed \\u2014 enough support that pupils can succeed at tasks they couldn't yet do alone. It works across a learning cycle, a whole lesson, and over a unit and key stage. Three types help in lesson design.\"]},\n          {t:'tabs', tabs:[\n            {label:'Visual', paras:[\"Support that guides pupils towards success visually.\"], example:'Success criteria, model examples, and images that support vocabulary teaching.'},\n            {label:'Verbal', paras:[\"Additional spoken instruction that addresses misconceptions and vocalises thought processes.\"], example:'Focused discussion, metacognitive narratives, modelling and demonstration.'},\n            {label:'Written', paras:[\"Structures that help pupils produce the task outcome.\"], example:'Word banks, writing frames, sentence starters and partially completed examples.'}\n          ]}\n        ]},\n        { id:'u1m3s3', title:'Diversity', blocks:[\n          {t:'text', paras:[\n            \"Diversity is one of our curriculum principles. Our teachers and content should be as positively diverse as the communities we serve. Where you're teaching beyond your own experience or identity, seek guidance from those with more direct experience wherever you can.\",\n            \"Inclusive language is one of our main tools \\u2014 using words that respect and acknowledge the diversity of people so everyone feels valued. Without it, we risk reinforcing stereotypes and power imbalances. Imagery matters too: diverse images provide representation and a sense of belonging, and can challenge stereotypes.\"\n          ]},\n          {t:'compare', goodText:'\\u2018Spokesperson\\u2019, \\u2018police officer\\u2019, \\u2018handyperson\\u2019 \\u2014 non-gendered language used where possible.', goodNote:'Inclusive and accurate, without making assumptions.', badText:'\\u2018Spokesman\\u2019, \\u2018policeman\\u2019, \\u2018handyman\\u2019.', badNote:'Gendered language that needlessly excludes.'},\n          {t:'accordion', chip:'#cdbdf2', items:[\n            {q:'Refer to protected characteristics only when relevant', a:[\"Mention a person's protected characteristics only if it's relevant to what you're communicating. That Tereshkova was female is relevant to her being the first woman in space; describing someone as \\u2018female\\u2019 when it isn't relevant to the point is not.\"]},\n            {q:'Avoid generalisations', a:[\"Language shouldn't make generalisations about groups of people. Watch words like \\u2018all\\u2019 \\u2014 they can turn a fact into a stereotype.\"]},\n            {q:'Use approved Oak characters', a:[\"When creating personas, use only the approved Oak characters, vary them across lessons and units, and pronounce all names \\u2014 characters, people and places \\u2014 accurately.\"]},\n            {q:'Choose imagery carefully', a:[\"Images should be culturally accurate, promote diversity and avoid stereotypes. A stereotypical image is acceptable only where balance is provided across a lesson or unit.\"]}\n          ]}\n        ]},\n        { id:'u1m3s4', title:'Safety, safeguarding & content guidance', blocks:[\n          {t:'text', paras:[\"These three areas protect pupils. Expand each for what to check.\"]},\n          {t:'accordion', chip:'#cdbdf2', items:[\n            {q:'Safety', a:[\"Where an activity could be dangerous, identify and address all health and safety considerations. Practical activities, demonstrations and modelling must follow and portray best practice, and safe behaviour is always modelled.\"]},\n            {q:'Safeguarding', a:[\"Apply the same safeguarding judgement as face-to-face teaching, in line with government guidelines. Keep content age-appropriate (a PG film isn't suitable for EYFS or KS1\\u20132), include no external URLs or links, and add content warnings for challenging content used only where essential. Remember the age range within a year group can vary widely.\"]},\n            {q:'Content guidance', a:[\"Flag content guidance in the CAT for any sensitive, potentially offensive, health-and-safety or safeguarding-related content. It appears on the lesson page for teachers and pupils.\"]}\n          ]},\n          {t:'callout', variant:'warning', title:'No external links', text:\"URLs or links to outside websites or software must never appear in lessons \\u2014 Oak can't control changes to that content or its security, so it's a safeguarding risk.\"}\n        ]},\n        { id:'u1m3s5', title:'Knowledge check', blocks:[\n          {t:'text', paras:[\"Check your understanding of the core considerations.\"]},\n          {t:'quiz', title:'Quick check: core considerations', questions:[\n            {kind:'mcq', stem:'What\\u2019s the minimum text-to-background contrast ratio for Oak lessons?', options:[{text:'2:1'},{text:'4.5:1', correct:true},{text:'10:1'}], explain:'WCAG 2.1 AA requires at least 4.5:1 \\u2014 already built into the templates.'},\n            {kind:'tf', stem:'You can include a link to a helpful external website in a lesson.', options:[{text:'True'},{text:'False', correct:true}], explain:'No external URLs or links \\u2014 Oak can\\u2019t control changes or security, so they\\u2019re a safeguarding risk.'},\n            {kind:'mcq', stem:'When should you refer to a person\\u2019s protected characteristic?', options:[{text:'Always, for representation'},{text:'Only when it\\u2019s relevant to what you\\u2019re communicating', correct:true},{text:'Never'}], explain:'Refer to protected characteristics only when relevant to the information being communicated.'}\n          ]}\n        ]},\n        { id:'u1m3s6', title:'Module summary', blocks:[\n          {t:'text', paras:[\"The responsibilities to hold onto as you create.\"]},\n          {t:'summary', points:[\n            \"Five areas keep lessons safe and responsible: accessibility, diversity, safety, safeguarding and content guidance.\",\n            \"Design for access \\u2014 meet WCAG 2.1 AA, keep strong contrast, and scaffold visually, verbally and in writing so all pupils can succeed.\",\n            \"Enact diversity through inclusive, non-gendered language and representative imagery, and uphold safeguarding with age-appropriate content, no external links and clear content guidance.\"\n          ], question:\"In the lesson you'll plan next, where could a scaffold or an inclusive language choice make the learning more accessible \\u2014 and is there any content that needs a guidance flag?\"}\n        ]}\n      ]},\n\n      // ============================================================\n      // ============= UNIT 2 · DESIGNING EXPLANATION ===============\n      // ============================================================\n\n      // ============= MODULE 1 =============\n      { id:'m1', unit:'u2', title:'The learning framework', color:'#bef2bd', colorStrong:'#93e892', outcomes:[\n        'Describe Oak\\u2019s evidence-informed learning framework and its seven stages',\n        'Explain where each stage happens across the learning journey',\n        'Recognise why every stage matters for learning to stick'\n      ], sections:[\n        { id:'m1s2', title:'What is the learning framework?', blocks:[\n          {t:'text', paras:[\n            \"Our learning framework is an evidence-informed model of learning, adapted from McCrea, P. Developing Expert Teaching (2023). We use it at Oak to guide and inform our design of lessons.\",\n            \"It pulls together all the composite parts required for anyone to learn something into a useful sequence. 'It' refers to the piece of new knowledge, and these seven stages are necessary for learning to happen effectively. Without any one of these stages, there is a risk that no learning happens.\"\n          ]},\n          {t:'image', src:'assets/learning-framework.png', maxWidth:'56%', alt:'Diagram of Oak’s learning framework: seven hexagonal stages — Fit it, Own it, Frame it, Get it, Use it and Keep it — arranged in sequence, all enclosed by a Check it border that runs throughout the model.', caption:'The learning framework — seven stages, with \"check it\" enclosing the model.', placeholder:'Learning framework diagram'},\n          {t:'callout', variant:'info', text:\"The learning framework does not span a single lesson but a much longer period of time. Fit it happens before learning starts; Own it, Frame it, Get it and Use it happen within a lesson; and Check it happens throughout.\"}\n        ]},\n        { id:'m1s3', title:'The seven stages', blocks:[\n          {t:'text', paras:[\"Each stage plays a distinct role. Expand each one to see what it means and how it shows up in Oak curricula and lessons.\"]},\n          {t:'accordion', chip:'#bef2bd', items:[\n            {q:'Fit it', badge:'1', a:[\"Ensuring pupils are learning the right knowledge. Learning needs to be fitted to the pupil — the teacher identifies the next thing pupils need to learn, based on what they already know.\"], features:['Curriculum sequence and curriculum information','Unit and lesson information on the website'], img:{placeholder:'Fit it — add image'}},\n            {q:'Own it', badge:'2', a:[\"Ensuring pupils are motivated to learn. Teachers build motivation at the start of a lesson — for example by engineering success and piquing interest. We pay attention to things we're motivated to do and see value in; without attention, pupils won't learn.\",\"The impact of poor motivation is compound — the Matthew effect: pupils who experience success spend more time learning and improve, while those who struggle come to believe it's 'not for them'.\"], features:['Prior knowledge starter quiz','Motivational nudges: teacher visibility, enthusiasm & informal tone','Accessibility measures, including web user experience'], img:{placeholder:'Own it — add image'}},\n            {q:'Frame it', badge:'3', a:[\"Ensuring pupils build on and link to existing knowledge. We make sense of new knowledge by connecting it to what we already know — like building a wall, each brick laid on those before. If new knowledge is too far from what pupils know, they won't understand it.\"], features:['Prior knowledge starter quiz','Verbal explanation linking new learning to prior learning'], img:{placeholder:'Frame it — add image'}},\n            {q:'Get it', badge:'4', a:[\"Helping pupils to understand the knowledge. This draws on the pedagogical strategy of explanation: knowledge is broken into manageable chunks and explained with techniques such as modelling and analogy. Teachers get pupils to think hard and make meaningful connections.\"], features:['Explicit explanation phases in lessons','Modelling'], img:{placeholder:'Get it — add image'}},\n            {q:'Use it', badge:'5', a:[\"Ensuring pupils practise application of the knowledge. Commonly called practice — a pupil puts their new learning to use.\"], features:['Explicit practice phases','Quizzing'], img:{placeholder:'Use it — add image'}},\n            {q:'Keep it', badge:'6', a:[\"Ensuring the knowledge sticks. The most effective learning takes months to secure, which is why our model goes beyond single lessons. Memory is subject to interference — forgetting that occurs naturally over time. Roughly 50% of new knowledge is remembered after an hour, falling to 20% after a week, unless we deliberately provide opportunities to recall. Each retrieval, spaced at increasing intervals, boosts the retention curve.\"], features:['Implicit retrieval throughout a unit','Unit level quiz (pending)'], img:{placeholder:'Keep it — add image'}},\n            {q:'Check it', badge:'7', a:[\"Checking and course-correcting throughout. Teachers check understanding and respond to what they find — asking questions, or giving pupils model responses to compare against. Crucially, check it happens alongside all the other stages.\"], features:['Prior knowledge starter quiz','Checks for understanding','Explicit feedback phases','Lesson summary, model task responses & assessment exit quiz'], img:{placeholder:'Check it — add image'}}\n          ]}\n        ]},\n        { id:'m1s3check', title:'Order the stages', blocks:[\n          {t:'text', paras:[\"Without looking back, put the first six stages in the order learning happens. Drag the cards or use the arrows to reorder them.\"]},\n          {t:'sortable', prompt:'The first six stages are sequential. Put them in the order learning happens. (Check it is the exception — it happens throughout.)', items:[\n            {id:'frame', text:'Frame it — build on existing knowledge'},\n            {id:'use', text:'Use it — practise application'},\n            {id:'fit', text:'Fit it — learning the right knowledge'},\n            {id:'keep', text:'Keep it — the knowledge sticks'},\n            {id:'own', text:'Own it — motivated to learn'},\n            {id:'get', text:'Get it — understand the knowledge'}\n          ], correct:['fit','own','frame','get','use','keep']}\n        ]},\n        { id:'m1s4', title:'When do the stages happen?', blocks:[\n          {t:'text', paras:[\"The stages don't all live inside one lesson. Explore where each happens across the learning journey.\"]},\n          {t:'hotspot', placeholder:'Timeline: before the lesson → within the lesson → across the unit', spots:[\n            {title:'Before learning starts', text:'Fit it happens before a lesson begins — the teacher decides what pupils need to learn next, supported by Oak curriculum and unit information.'},\n            {title:'Within the lesson', text:'Own it, Frame it, Get it and Use it all happen inside the lesson — building motivation, linking to prior learning, explaining new knowledge, and practising it.'},\n            {title:'Across the unit and beyond', text:'Keep it stretches over weeks and months through spaced retrieval. Check it runs throughout every stage, course-correcting as needed.'}\n          ]},\n          {t:'callout', variant:'tip', title:'Why it matters', text:\"Should one of these stages be absent or poorly executed, learning is likely to be hampered. Designing lessons with the whole framework in mind keeps every stage intentional.\"}\n        ]},\n        { id:'m1s5', title:'Knowledge check', blocks:[\n          {t:'text', paras:[\"Check your understanding of the learning framework before moving on.\"]},\n          {t:'quiz', title:'Quick check: the learning framework', questions:[\n            {kind:'mcq', stem:'Which stage happens throughout, alongside all the others?', options:[{text:'Fit it'},{text:'Get it'},{text:'Check it', correct:true},{text:'Keep it'}], explain:'Check it runs continuously — shown by the dark border enclosing the whole model.'},\n            {kind:'tf', stem:'The learning framework spans a single lesson.', options:[{text:'True'},{text:'False', correct:true}], explain:'It spans a much longer period — Keep it alone takes weeks or months.'},\n            {kind:'mcq', stem:'Which stage draws most directly on the pedagogical strategy of explanation?', options:[{text:'Own it'},{text:'Get it', correct:true},{text:'Use it'},{text:'Fit it'}], explain:'Get it is where new knowledge is chunked and explained so pupils understand it.'}\n          ]}\n        ]},\n        { id:'m1s6', title:'Module summary', blocks:[\n          {t:'text', paras:[\"Here's what to carry forward from the learning framework before you move on to explanation.\"]},\n          {t:'summary', points:[\n            \"Oak's learning framework is an evidence-informed model of seven stages — each one necessary for learning to happen and stick.\",\n            \"The first six stages are broadly sequential (Fit it, Own it, Frame it, Get it, Use it, Keep it), while Check it runs throughout.\",\n            \"It spans far more than one lesson: Fit it comes before the lesson, four stages sit within it, and Keep it stretches across the unit and beyond.\"\n          ], question:\"As you plan your next lesson, which of the seven stages do you tend to design most thoroughly — and which might you be leaving to chance?\"}\n        ]}\n      ]},\n\n      // ============= MODULE 2 =============\n      { id:'m2', unit:'u2', title:'High-quality explanation', color:'#a0b6f2', colorStrong:'#7c9aec', outcomes:[\n        'Distinguish substantive, disciplinary and procedural knowledge',\n        'Apply the three principles: connected, chunked and clear',\n        'Choose between simple-to-complex, part-whole and whole-part approaches'\n      ], sections:[\n        { id:'m2s1', title:'What is explanation?', blocks:[\n          {t:'text', paras:[\n            \"Explanation is a pedagogical strategy that involves providing pupils with clear and concise information about a topic or concept. The goal is to help pupils understand and engage with the material by keeping a sharp focus on optimising intrinsic load.\",\n            \"Teachers communicate through speech, text, non-verbal gestures and resources continuously throughout a lesson. Much of this is explanation — introducing a concept, modelling a task, correcting behaviour, writing instructions. Whatever the method, effective explanation is at the centre of learning.\"\n          ]},\n          {t:'callout', variant:'quote', text:'The most effective teachers spend double the amount of time explaining, giving examples, demonstrating and asking questions than the least effective teachers.', attrib:'Rosenshine'}\n        ]},\n        { id:'m2s2', title:'Types of knowledge', blocks:[\n          {t:'text', paras:[\"It's important to differentiate between three types of knowledge. This supports richer decisions about the approach to explanation. The balance may vary by subject, unit and lesson.\"]},\n          {t:'tabs', tabs:[\n            {label:'Substantive', paras:[\"The content knowledge of a subject — facts, concepts and theories. It's the foundational knowledge pupils need in order to understand and engage with a subject.\"], example:'In maths, this includes addition, subtraction, multiplication and division, plus the properties of numbers and equations.'},\n            {label:'Disciplinary', paras:[\"The ways of thinking, reasoning and communicating unique to a discipline — the methods, approaches and practices used to investigate, analyse and explain ideas within a subject.\"], example:'In history, this is knowing how historians investigate the past and construct claims, arguments and accounts.'},\n            {label:'Procedural', paras:[\"Knowledge of how to do something — a skill or technique, performing a sequence of actions to achieve a goal. 'Knowing how' rather than 'knowing that' or 'knowing why'. It's delivered through modelling and demonstration with appropriate scaffolds.\"], example:'In computer science, being able to implement a repeat in a programming language.'}\n          ]}\n        ]},\n        { id:'m2s3', title:'Three principles', blocks:[\n          {t:'text', paras:[\"Three guiding principles underpin high-quality explanation. Tap each card to see what it means at Oak.\"]},\n          {t:'flip', chip:'#a0b6f2', cards:[\n            {badge:'1', front:'Connected', back:\"Our brains organise information into schemata; we can only store new knowledge by connecting it to what we already have. Oak explanations link to prior learning, lodge new content within a broader sequence, and foster engagement through frequent active participation.\"},\n            {badge:'2', front:'Chunked', back:\"The right amount of information at the right time, to minimise extraneous load. Rosenshine's small steps limit the number and complexity of new pieces at once. Chunking also means sequencing skills, concepts and content to build towards mastery.\"},\n            {badge:'3', front:'Clear', back:\"Take complex, abstract material and transform it into concrete, simple ideas without losing complexity. Cut inessential information; present all essential information together. Clarity of language is vital for understanding and remembering difficult concepts.\"}\n          ]}\n        ]},\n        { id:'m2s4', title:'Delivering explanations', blocks:[\n          {t:'text', paras:[\"A number of instructional approaches reduce extraneous cognitive load and increase the efficacy of explanation. Explore the three approaches and an example of each.\"]},\n          {t:'tabs', tabs:[\n            {label:'Simple to complex', paras:[\"Elements of the material are introduced in a simple-to-complex order so the pupil doesn't initially experience the full complexity of the material.\"], example:'Phonics: pupils are taught sounds first (e.g. \\u2018b\\u2019), then digraphs (\\u2018ea\\u2019, \\u2018ch\\u2019), before the full word \\u2018beach\\u2019.'},\n            {label:'Part-whole', paras:[\"Individual elements are introduced first, before the integrated task. The teacher breaks the complex task into sub-tasks and builds skill at each before bringing them together in the whole.\"], example:'Reading an Ordnance Survey map is broken into parts: symbols, then grid references, then scale, then contour lines.'},\n            {label:'Whole-part', paras:[\"The material is introduced in full complexity from the beginning, then the pupil's attention is directed to each separate part. This helps learners understand how the sub-parts interact.\"], example:'Shooting a basketball: demonstrate the whole skill first, then break it down — feet position, aim, and so on.'}\n          ]}\n        ]},\n        { id:'m2s5', title:'Knowledge check', blocks:[\n          {t:'quiz', title:'Quick check: high-quality explanation', questions:[\n            {kind:'mcq', stem:'Which set of principles underpins high-quality explanation at Oak?', options:[{text:'Connected, chunked, clear', correct:true},{text:'Plan, teach, assess'},{text:'Engage, explain, evaluate'}], explain:'The three Cs: connected, chunked and clear.'},\n            {kind:'mcq', stem:'Introducing sounds, then digraphs, then a whole word is an example of which approach?', options:[{text:'Whole-part'},{text:'Simple to complex', correct:true},{text:'Part-whole'}], explain:'Material moves from simple elements to the full complexity.'},\n            {kind:'tf', stem:'Disciplinary knowledge refers to facts, concepts and theories.', options:[{text:'True'},{text:'False', correct:true}], explain:'That describes substantive knowledge. Disciplinary knowledge is the ways of thinking and reasoning within a subject.'}\n          ]}\n        ]},\n        { id:'m2s6', title:'Module summary', blocks:[\n          {t:'text', paras:[\"The essentials of high-quality explanation to keep in mind as you design.\"]},\n          {t:'summary', points:[\n            \"Explanation sits at the centre of learning, with a sharp focus on optimising intrinsic cognitive load.\",\n            \"Distinguish substantive, disciplinary and procedural knowledge — the balance shapes how you explain.\",\n            \"Make every explanation connected, chunked and clear, and choose simple-to-complex, part-whole or whole-part to suit the material.\"\n          ], question:\"Thinking about a concept you'll teach soon — what type of knowledge is it, and does your current explanation feel genuinely connected, chunked and clear?\"}\n        ]}\n      ]},\n\n      // ============= MODULE 3 =============\n      { id:'m3', unit:'u2', title:'Enriching explanations', color:'#b0e2de', colorStrong:'#7cd8d0', outcomes:[\n        'Identify the six ways to enrich an explanation',\n        'Use examples, non-examples and worked examples effectively',\n        'Account for the expertise reversal effect as pupils progress'\n      ], sections:[\n        { id:'m3s1', title:'Six ways to enrich', blocks:[\n          {t:'text', paras:[\"Explanations are enriched through six features that support learning. These can appear as visual support on slide decks, or be added verbally in videos.\",\"Teachers may use analogies, examples, non-examples, worked examples, stories, modelling, demonstration or discussion to enrich explanations.\"]},\n          {t:'flip', chip:'#b0e2de', cards:[\n            {badge:'A', front:'Examples & non-examples', back:\"Examples give concrete illustrations of abstract ideas and build connections to existing knowledge. Non-examples clarify boundaries — showing what a concept is not — and help pupils avoid misconceptions. Worked examples fully guide novices, reducing load on working memory.\"},\n            {badge:'B', front:'Images', back:\"Appropriately selected images convey information visually and intuitively, helping pupils build schema. With keywords and narration they reduce the redundancy effect, make complex information accessible, and capture attention.\"},\n            {badge:'C', front:'Discussion', back:\"Discussion allows deeper exploration, develops critical thinking and communication, connects material to pupils' own experience, and gives the teacher immediate feedback on understanding.\"},\n            {badge:'D', front:'Modelling & demonstration', back:\"Modelling shows a new concept or approach; demonstration is a practical exhibition of how something works. Pupils see the process and steps in action, build confidence, and learn to transfer principles to new contexts.\"},\n            {badge:'E', front:'Stories', back:\"Stories are the oldest method of passing down information. They engage pupils emotionally and intellectually, create a memorable context, and activate sensory and emotional centres to encode information more deeply.\"},\n            {badge:'F', front:'Analogies', back:\"Analogies help pupils access unfamiliar concepts and move understanding from the concrete to the abstract — e.g. reading a landscape like a book. Caution: take care not to embed a misconception.\"}\n          ]}\n        ]},\n        { id:'m3s2', title:'Worked examples in depth', blocks:[\n          {t:'text', paras:[\n            \"A worked example is a problem already solved for the learner, with every step fully explained and clearly shown. Research shows novices given worked examples to study outperform those required to solve equivalent problems themselves — unguided problem-solving overloads working memory and inhibits transfer to long-term memory.\",\n            \"Worked examples free up working memory so pupils focus on how to solve the problem rather than only on the answer, making them more likely to recall the method in future.\"\n          ]},\n          {t:'callout', variant:'warning', title:'The expertise reversal effect', text:\"Heavy use of worked examples becomes less effective as expertise increases — eventually redundant or even counterproductive. Gradually incorporate more independent problem-solving as pupils progress.\"},\n          {t:'image', caption:'A part-worked example with steps revealed progressively.', placeholder:'Worked example slide'}\n        ]},\n        { id:'m3s3', title:'Knowledge check', blocks:[\n          {t:'quiz', title:'Quick check: enriching explanations', questions:[\n            {kind:'mcq', stem:'Why are non-examples useful alongside examples?', options:[{text:'They clarify what a concept is not, refining its boundaries', correct:true},{text:'They replace the need for explanation'},{text:'They increase cognitive load deliberately'}], explain:'Non-examples help pupils see the limits of a concept and avoid misconceptions.'},\n            {kind:'tf', stem:'Worked examples remain equally effective as pupils become experts.', options:[{text:'True'},{text:'False', correct:true}], explain:'The expertise reversal effect: they become redundant or counterproductive for more expert pupils.'},\n            {kind:'mcq', stem:'Using an analogy carries which key risk?', options:[{text:'It always confuses pupils'},{text:'It can embed a misconception', correct:true},{text:'It removes the need for examples'}], explain:'Analogies are powerful but must be chosen carefully so they don\\u2019t embed a misconception.'}\n          ]}\n        ]},\n        { id:'m3s4', title:'Module summary', blocks:[\n          {t:'text', paras:[\"Carry these enrichment principles into your next explanation.\"]},\n          {t:'summary', points:[\n            \"Six features enrich explanations: examples & non-examples, images, discussion, modelling & demonstration, stories and analogies.\",\n            \"Worked examples free up novices' working memory — but the expertise reversal effect means you should fade them as pupils gain expertise.\",\n            \"Non-examples sharpen the boundaries of a concept; analogies are powerful but can embed misconceptions if chosen carelessly.\"\n          ], question:\"Where in your next explanation could a non-example or a worked example deepen understanding — and at what point should you start fading that support?\"}\n        ]}\n      ]},\n\n      // ============= MODULE 4 =============\n      { id:'m4', unit:'u2', title:'Checks for understanding', color:'#deb7d5', colorStrong:'#cf9cc3', outcomes:[\n        'Design CfUs that expose misconceptions and are quick to respond to',\n        'Select the right question type: multiple choice, short answer or true/false/why',\n        'Provide effective feedback for each type of CfU'\n      ], sections:[\n        { id:'m4s1', title:'What is a check for understanding?', blocks:[\n          {t:'text', paras:[\n            \"Checking for understanding (CfU) is a constant process critical for successful learning. It requires responsiveness from the teacher throughout a lesson — agility to respond as needs arise, but also deliberate planning. It's the 'check it' part of our learning framework.\",\n            \"CfUs in Oak lessons are snappy, interactive moments where the teacher checks understanding after explanations and assesses the key learning points. They support teachers to adapt the lesson based on pupil responses, and should reflect common misconceptions and mistakes in the content being taught.\"\n          ]},\n          {t:'callout', variant:'quote', text:'The champions of CfU make a habit of small intentional habits, applied consistently — a trusty safety net for pupils\\u2019 learning.', attrib:'Lemov'}\n        ]},\n        { id:'m4s2', title:'Principles of good CfUs', blocks:[\n          {t:'text', paras:[\"There's a minimum of two CfUs per learning cycle, peppered thoughtfully throughout the explanation rather than all explanation slides followed by all CfU slides. Answers should be short and easy to respond to on a mini-whiteboard.\"]},\n          {t:'compare', goodText:'A CfU that is quick to respond to on a mini-whiteboard, using structure such as 1. and 2. to guide the response.', goodNote:'The teacher can scan the room and complete a quick assessment of learning.', badText:'A CfU that demands a long, open response.', badNote:'The teacher cannot scan the room and quickly assess learning — it slows the lesson down.'},\n          {t:'accordion', chip:'#deb7d5', items:[\n            {q:'Pitch so guessing is hard', a:[\"It should not be possible to guess the correct answer. CfUs are pitched accurately and link directly to the explanation explicitly covered just before.\"]},\n            {q:'Expose misconceptions', a:[\"CfU questions are ideally focused to expose common mistakes or misconceptions, which are then explicitly addressed during explanation and re-checked in the assessment exit quiz.\"]},\n            {q:'Increase demand through a set', a:[\"Where questions following an explanation have different levels of demand, lower-demand questions are asked first and demand increases through the set.\"]},\n            {q:'Use emphasis carefully', a:[\"Where a word needs emphasis, bold can be used — but the emphasised word should be in the banner colour. Keywords stay in black bold.\"]}\n          ]}\n        ]},\n        { id:'m4s2check', title:'Knowledge check', blocks:[\n          {t:'text', paras:[\"A quick check before we look at question types — modelling the principle that checks should be peppered through the content, not saved for the end.\"]},\n          {t:'quiz', title:'Quick check: what good CfUs do', questions:[\n            {kind:'mcq', stem:'Which part of the learning framework does checking for understanding map onto?', options:[{text:'Fit it'},{text:'Check it', correct:true},{text:'Keep it'}], explain:'CfU is the \\u2018check it\\u2019 part of the learning framework — it runs throughout every stage.'},\n            {kind:'mcq', stem:'How many CfUs are there, as a minimum, per learning cycle?', options:[{text:'One'},{text:'Two', correct:true},{text:'Five'}], explain:'A minimum of two CfUs per learning cycle, peppered through the explanation.'},\n            {kind:'tf', stem:'A good CfU asks for a long, open response so the teacher can assess deeply.', options:[{text:'True'},{text:'False', correct:true}], explain:'Answers should be short and easy to respond to on a mini-whiteboard, so the teacher can scan the room quickly.'}\n          ]}\n        ]},\n        { id:'m4s3', title:'Question types', blocks:[\n          {t:'text', paras:[\"There are three types of question that can be used as CfUs. Vary the type between learning cycles to avoid task fatigue.\"]},\n          {t:'tabs', tabs:[\n            {label:'Multiple choice', paras:[\"The teacher can see responses (a/b/c) at a glance. A question stem, one or two correct responses, and at least two distractors — with 3–5 answer choices, minimally different from each other. Label answers a, b, c (not 1, 2, 3).\"], example:'Best when the answer is one of a defined set, when misconceptions can be addressed through distractors, or where nuance leads to minimally different options.'},\n            {label:'Short answer', paras:[\"A gap-fill or a question requiring a single word or number. In gap-fills, indicate missing words with a 4pt drawn black line, removed when answers are revealed; multiple lines should be the same length to avoid clues.\"], example:'Best when there aren\\u2019t enough plausible distractors, when spelling matters, when alternatives might reinforce a misconception, or when the desired challenge is high.'},\n            {label:'True / false / why', paras:[\"A straightforward way to check a simple factual statement. Because there's a 50:50 chance of guessing, pupils are encouraged to explain their answer — providing evidence of understanding.\"], example:'Best when there is a simple fact to check, or when checking explanation detail covered in the learning cycle is important.'}\n          ]}\n        ]},\n        { id:'m4s4', title:'Feedback', blocks:[\n          {t:'text', paras:[\n            \"Feedback is provided for all CfUs. The approach varies, but should always give pupils the answer and, where appropriate, information to explain it. Where there may be no single correct answer, a model response is provided, acknowledging
