# SonarQube Cloud automatic analysis configuration.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis#additional-analysis-configuration
#
# This repo uses SonarCloud automatic analysis, which reads ONLY this file —
# there is deliberately no sonar-project.properties. Per-issue dispositions
# (FALSE_POSITIVE / SAFE) are made server-side in SonarCloud, never via
# file-based rule-ignore config (per-rule glob disables are forbidden — see
# docs/governance/sonar-disposition-policy.md).
#
# Agent tooling source remains in the CPD corpus. Only generated artefacts,
# tests, package-local config shapes, external-source data snapshots (the
# `*.external-data.ts` convention), and curated naming-schema wordlist data
# (ADR-198; owner-authorised 2026-06-11, PR #189) are excluded.
sonar.cpd.exclusions=**/src/types/generated/**,**/*.test.ts,**/*.test.tsx,**/tests/**,**/e2e-tests/**,**/*.config.*,packages/sdks/oak-sdk-codegen/src/types/generated/api-schema/**,**/*.external-data.ts,agent-tools/src/core/agent-identity/schemas/**,packages/design/oak-design-system/**

# Design-system studio-instrument scope (ADR-213; AIP-137 PR2; owner ratifies
# at PR review). The integrated design system's specimen cards, white-label
# proofs, reference build, templates, and vendored reveal.js are validation
# instruments RENDERED INSIDE the Claude Design studio shell (which supplies
# the page title/lang/labels Sonar reports as missing from the fragments), and
# the proofs are byte-identical across brands BY DESIGN (that is the proof).
# brand.css is a deliberately fully-commented override template — its
# "commented-out code" IS the artefact. These subtrees are excluded from
# analysis as non-product asset classes — the same scope verdict knip and
# dependency-cruiser record for this workspace (see knip.config.ts and
# .dependency-cruiser.mjs). The system's CONSUMABLE surface (the root token
# CSS, class library, print layer, oak-icons.css, oak-theme.js, the compiled
# reference components' .jsx) stays fully analysed. This is scope definition,
# not per-rule disabling; the sonar-disposition-policy's per-issue outcomes
# continue to govern everything in scope. The design-system CPD exclusion
# above covers the in-scope remainder too: theme blocks repeat structure
# across four themes by construction. components/** joined the instrument
# class 2026-07-19: the four .jsx are STUDIO-COMPILED reference
# implementations, off the package export surface by ADR-213 §3 (apps cannot
# import them — Base UI + the class library is the consumption path), and
# their internal quality is studio-session work (the OakButton cognitive-
# complexity finding is on the studio sync-back list, ARC channel + PR #411).
sonar.exclusions=packages/design/oak-design-system/preview/**,packages/design/oak-design-system/whitelabel/**,packages/design/oak-design-system/ui_kits/**,packages/design/oak-design-system/templates/**,packages/design/oak-design-system/integrations/revealjs/vendor/**,packages/design/oak-design-system/components/**,packages/design/oak-design-system/Example Front Pages.html,packages/design/oak-design-system/Identity Switchboard.html,packages/design/oak-design-system/Identity White-Labelling.html,packages/design/oak-design-system/brand.css

# Path to sources
# sonar.sources=
# sonar.inclusions=

# Path to tests
# sonar.tests=
# sonar.test.exclusions=
# sonar.test.inclusions=

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclusions for copy-paste detection
# sonar.cpd.exclusions=

# Python version (for python projects only)
# sonar.python.version=

# C++ standard version (for C++ projects only)
# If not specified, it defaults to the latest supported standard
# sonar.cfamily.reportingCppStandardOverride=c++98|c++11|c++14|c++17|c++20
