version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    ignore:
      # @types/node is deliberately held on the Node 24 LTS major to match the
      # repo's `engines.node: 24.x`. Allow minor/patch within 24.x; suppress the
      # major bump (26.x) so the weekly grouped PR stops re-proposing it. Lift
      # this when the project moves to a newer Node major.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # TypeScript 7's exports map removes the `typescript/bin/tsc` subpath that
      # agent-tools/src/bootstrap/bootstrap.ts resolves at postinstall, so a TS
      # major riding the weekly group bump breaks install (seen on PR #416).
      # Allow minor/patch; TS 7 adoption is a deliberate separate change — lift
      # this when the repo moves to TypeScript 7.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
